        ${puede?`<td><div class="rowact">${x.est==='pendiente'?
          `<button class="btn ghost sm" onclick="resolverInc('${x.id}',true)">Aprobar</button>
           <button class="iconbtn del" title="Rechazar" onclick="resolverInc('${x.id}',false)">×</button>`
          :''}</div></td>`:''}</tr>`).join('')}
      </tbody></table></div>`
    :`<div class="empty"><b>Sin incidencias</b>No hay registros que coincidan con los filtros.</div>`}
  </div>`;
}},

nomina:{ t:()=>ROL()==='supervisor_tienda'?'Nómina de mi tienda':'Procesar nómina', h:()=>{
  const L=empleadosVisibles().filter(e=>e.est!=='egresado');
  const ap=ESTADO.nominaAprobada;
  const filas=L.map(e=>{
    const r = calcularRecibo(e,'sueldo');
    const c = calcularRecibo(e,'complemento').tA + calcularRecibo(e,'cestaticket').tA;
    const A = AJUSTES[e.id] || {};
    // Un ajuste manual manda sobre lo calculado, pero el original no se pierde
    const asig = A.asig!=null ? +A.asig : r.tA + c;
    const ded  = A.ded !=null ? +A.ded  : r.tD;
    return {e, asig, ded, neto:asig-ded, sal:r.salarial,
            asigCalc:r.tA+c, dedCalc:r.tD, ajuste:A.motivo?A:null};
  });
  const T={asig:filas.reduce((a,f)=>a+f.asig,0), ded:filas.reduce((a,f)=>a+f.ded,0),
           neto:filas.reduce((a,f)=>a+f.neto,0)};
  const per = periodoActual();
  const editable = esGerente() && !ap;
  return `${barraFiltros({conBusqueda:false})}
  <div class="steps">
    <div class="step done"><div class="n">PASO 1 ✓</div><b>Corte de asistencia</b></div>
    <div class="step done"><div class="n">PASO 2 ✓</div><b>Aprobar pendientes</b></div>
    <div class="step done"><div class="n">PASO 3 ✓</div><b>Cálculo</b></div>
    <div class="step ${ap?'done':'now'}"><div class="n">PASO 4${ap?' ✓':''}</div>
      <b>${ap?'Aprobada':(esGerente()?'Aprobación final':'Revisión')}</b></div>
  </div>
  <div class="grid tiles" style="margin-bottom:16px">
    <div class="tile"><div class="lab">Periodo</div>
      <div class="val" style="font-size:20px">${esc(per.et)}</div>
      <div class="meta">Quincenal · ${per.dias} días</div></div>
    <div class="tile"><div class="lab">Tasa BCV congelada</div>
      <div class="val">${bs(TASA).split(',')[0]}<small>,${bs(TASA).split(',')[1]}</small></div>
      <div class="meta">${tasaHoy()?'Del '+fechaCorta(tasaHoy().fecha)+' · fijada al calcular'
        :'⚠ Sin tasa cargada · cárgala en Configuración'}</div></div>
    <div class="tile"><div class="lab">Total neto</div><div class="val">Bs. ${k(T.neto)}</div>
      <div class="meta">USD ${k(T.neto/TASA)} · ${L.length} empleados</div></div>
    <div class="tile"><div class="lab">Costo total empresa</div><div class="val">Bs. ${k(T.neto*1.05)}</div>
      <div class="meta">Incluye aportes patronales</div></div>
  </div>
  <div class="card" style="margin-bottom:16px">
    <div class="card-h"><h3>Detalle por empleado</h3>
      <p class="sub">${FILTRO.tienda?nomTienda(FILTRO.tienda):tiendaFija()?nomTienda(tiendaFija()):'Consolidado'}</p>
      <div class="spacer"></div>${ap?'<span class="pill ok">Aprobada</span>':'<span class="pill in">Calculada</span>'}</div>
    ${filas.length?`<div class="tbl-wrap"><table>
      <thead><tr><th>Empleado</th>${tiendaFija()?'':'<th>Tienda</th>'}<th class="num">Días</th>
        <th class="num">Asignaciones</th><th class="num">Deducciones</th><th class="num">Neto Bs.</th>
        <th class="num">Neto USD</th><th class="num">Base prestaciones</th>
        ${editable?'<th></th>':''}</tr></thead>
      <tbody>${filas.map((f,i)=>`<tr class="${f.ajuste?'ajustada':''}">
        <td><div class="who"><div class="av" style="background:${COL[i%4]}">${ini(f.e.n)}</div>
          <div><b>${esc(f.e.n)}</b><span>${esc(f.e.cargo)}</span>
          ${f.ajuste?`<span class="mini" style="color:var(--warn)">✎ ${esc(f.ajuste.motivo)}</span>`:''}
          </div></div></td>
        ${tiendaFija()?'':`<td><span class="pill nu">${esc(f.e.t)}</span></td>`}
        <td class="num">${per.dias}</td>
        <td class="num">${editable
          ? `<input class="celda num" type="number" step="0.01" value="${f.asig.toFixed(2)}"
               title="Calculado: ${bs(f.asigCalc)}" onchange="ajustarNomina('${f.e.id}','asig',this.value)">`
          : bs(f.asig)}</td>
        <td class="num">${editable
          ? `<input class="celda num" type="number" step="0.01" value="${f.ded.toFixed(2)}"
               title="Calculado: ${bs(f.dedCalc)}" onchange="ajustarNomina('${f.e.id}','ded',this.value)">`
          : bs(f.ded)}</td>
        <td class="num"><b>${bs(f.neto)}</b></td><td class="num">${bs(f.neto/TASA)}</td>
        <td class="num" style="color:var(--brand)">${bs(f.sal)}</td>
        ${editable?`<td><div class="acciones">
          <button class="iconbtn" title="Ver el recibo" onclick="ir('recibos')">▤</button>
          ${f.ajuste?`<button class="iconbtn" title="Deshacer el ajuste"
            onclick="deshacerAjuste('${f.e.id}')">↺</button>`:''}
        </div></td>`:''}
        </tr>`).join('')}
      </tbody></table></div>`:'<div class="empty"><b>Sin empleados</b>Ajusta los filtros.</div>'}
    ${editable?`<div class="card-b" style="border-top:1px solid var(--line-2)">
      <div class="note in"><span class="ni">◔</span><div>
        Las columnas de <b>asignaciones</b> y <b>deducciones</b> se pueden corregir a mano cuando
        el cálculo no da lo que hace falta. Cada corrección pide un motivo escrito y deja el
        monto original guardado: al aprobar la nómina, la base de datos graba quién ajustó qué
        y por qué. Una vez aprobada ya no se puede tocar.</div></div>
    </div>`:''}</div>
  ${esGerente()?(ap?`<div class="note ok" style="background:var(--good-soft);border-color:transparent">
      <span class="ni" style="color:var(--good)">✓</span><div><b>Nómina aprobada y sellada.</b>
      Los recibos ya están disponibles para los trabajadores. Cualquier corrección exige
      una nómina de ajuste retroactivo.</div></div>`
    :`<div class="card"><div class="card-b" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <div style="flex:1;min-width:220px"><b>Aprobar esta nómina</b>
        <p style="font-size:13px;color:var(--ink-3)">Una vez aprobada queda sellada.</p></div>
      <button class="btn ghost sm" onclick="aviso('Nómina devuelta a revisión')">Devolver a revisión</button>
      <button class="btn sm" style="width:auto" onclick="aprobarNomina()">Aprobar y generar recibos</button>
    </div></div>`)
  :`<div class="note in"><span class="ni">◔</span><div>Puedes revisar la nómina de tu tienda,
    pero <b>la aprobación final corresponde a la gerencia general</b>.</div></div>`}`;
}},

recibos:{ t:()=>ROL()==='empleado'?'Mis recibos':'Recibos de pago', h:()=>{
  const TR = window.TIPO_RECIBO || 'sueldo';
  const pestanasRecibo = ()=>`<div class="tabs" style="margin-bottom:14px">
    ${Object.entries(RECIBO_TIPOS).map(([id,m])=>
      `<span class="tab ${TR===id?'on':''}" onclick="window.TIPO_RECIBO='${id}';pintar()">${esc(m.et)}</span>`).join('')}
  </div>`;

  if(ROL()==='empleado'){
    const yo = ESTADO.empleados.find(x=>x.usuario_id===SESION.id);
    return `${pestanasRecibo()}
    <div class="grid" style="grid-template-columns:minmax(0,460px) minmax(0,1fr);align-items:start">
      ${reciboHTML(TR)}
      <div class="card"><div class="card-h"><h3>Descargar</h3><div class="spacer"></div></div>
        <div class="card-b">
          <p style="font-size:13.5px;color:var(--ink-2);margin-bottom:12px">
            Cada concepto se entrega en su propia hoja. El sueldo es salario; el complemento
            alimentario y el cestaticket son bonificaciones que <b>no generan prestaciones</b>.</p>
          ${yo?Object.entries(RECIBO_TIPOS).map(([id,m])=>
            `<button class="btn ghost sm" style="width:100%;margin-bottom:8px"
               onclick="imprimirRecibos(['${esc(yo.ci)}'],'${id}')">↧ ${esc(m.et)}</button>`).join('')
          :'<div class="empty"><b>Sin ficha</b>Tu usuario todavía no está vinculado a un empleado.</div>'}
        </div></div>
    </div>`;
  }

  const L = empleadosVisibles().filter(e=>e.est!=='egresado');
  const cis = L.map(e=>e.ci);
  const sel = cis.filter(c=>SEL_RECIBOS.has(c));
  const alcance = FILTRO.tienda||tiendaFija();
  const objetivo = JSON.stringify(sel.length?sel:cis).replace(/"/g,'&quot;');
  return `${barraFiltros({acciones:`
      <button class="btn ghost sm" onclick="seleccionarTodos(${JSON.stringify(cis).replace(/"/g,'&quot;')})">
        ${sel.length===cis.length&&cis.length?'Quitar selección':'Seleccionar todos'}</button>`})}

  <div class="card" style="margin-bottom:16px"><div class="card-b"
      style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <div style="flex:1;min-width:200px"><b>Descargar ${sel.length?sel.length+' recibo'+(sel.length===1?'':'s'):'todos los recibos'}</b>
      <p style="font-size:12.5px;color:var(--ink-3);margin-top:2px">
        Un botón por tipo. Cada uno sale en su propia hoja.</p></div>
    ${Object.entries(RECIBO_TIPOS).map(([id,m])=>
      `<button class="btn ${id==='sueldo'?'':'ghost'} sm" style="width:auto"
         onclick="imprimirRecibos(${objetivo},'${id}')">↧ ${esc(m.et)}</button>`).join('')}
  </div></div>

  ${ROL()==='supervisor_tienda'?`<div class="note in" style="margin-bottom:16px"><span class="ni">◔</span>
    <div>Puedes descargar los recibos de <b>${esc(nomTienda(tiendaFija()))}</b>, tu tienda asignada.
    Los de otras tiendas no aparecen aquí ni pueden solicitarse.</div></div>`:''}

  <div class="grid tiles" style="margin-bottom:16px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
    <div class="tile"><div class="lab">Recibos del periodo</div><div class="val">${L.length}</div>
      <div class="meta">${alcance?nomTienda(alcance):'Todas las tiendas'} · 2.ª quincena de agosto</div></div>
    <div class="tile"><div class="lab">Seleccionados</div><div class="val">${sel.length||L.length}</div>
      <div class="meta">${sel.length?'Listos para descargar':'Se descargarán todos'}</div></div>
    <div class="tile"><div class="lab">Total neto</div>
      <div class="val">Bs. ${k(L.reduce((a,e)=>a+reciboDe(e).neto,0))}</div>
      <div class="meta">USD ${k(L.reduce((a,e)=>a+reciboDe(e).neto,0)/TASA)}</div></div>
    <div class="tile"><div class="lab">Estado de la nómina</div>
      <div class="val" style="font-size:20px">${ESTADO.nominaAprobada?'Aprobada':'Calculada'}</div>
      <div class="meta">${ESTADO.nominaAprobada?'Recibos definitivos':'Aún puede cambiar'}</div></div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-h"><h3>Recibos disponibles</h3>
      <p class="sub">Haz clic para seleccionar · el botón de arriba los descarga</p></div>
    <div class="card-b">
      ${L.length?`<div class="reciboLista">${L.map((e,i)=>{const r=reciboDe(e);
        return `<div class="rcard ${SEL_RECIBOS.has(e.ci)?'sel':''}" onclick="alternarRecibo('${e.ci}')">
          <div class="chk">${SEL_RECIBOS.has(e.ci)?'✓':''}</div>
          <div class="rn">0001-2026-${String(400+i).padStart(6,'0')}</div>
          <b>${esc(e.n)}</b>
          <div class="rm">${esc(e.cargo)} · ${esc(e.t)}</div>
          <div class="rv">Bs. ${bs(r.neto)}</div>
          <div class="rm">USD ${bs(r.neto/TASA)}</div>
        </div>`}).join('')}</div>`
      :`<div class="empty"><b>Sin recibos</b>Ajusta los filtros o procesa la nómina primero.</div>`}
    </div></div>

  <div class="note wa"><span class="ni">⚑</span><div>
    Al descargar se abre el <b>diálogo de impresión del navegador</b>: elige
    <b>«Guardar como PDF»</b> como destino y tendrás un archivo con un recibo por página,
    listo para enviar o archivar.</div></div>`;
}},

prestaciones:{ t:()=>ROL()==='empleado'?'Mis prestaciones':'Prestaciones sociales', h:()=>{
  const L = empleadosVisibles().filter(e=>e.est!=='egresado');
  if(!L.length) return `<div class="empty"><b>Sin empleados</b>
    Carga personal para poder calcular prestaciones.</div>`;

  // El empleado ve lo suyo; los demás eligen a quién consultar
  if(!PREST.empleado || !L.some(e=>e.id===PREST.empleado)) PREST.empleado = L[0].id;
  const e = L.find(x=>x.id===PREST.empleado);
  const s = PREST.saldo, q = PREST.liq;

  return `${ROL()==='empleado'?'':`<div class="toolbar">
      <select class="filtro" style="min-width:250px" onchange="elegirEmpleadoPrest(this.value)">
        ${L.map(x=>`<option value="${x.id}" ${x.id===PREST.empleado?'selected':''}>
          ${esc(x.n)} · ${esc(x.cargo)} · ${esc(x.t)}</option>`).join('')}
      </select>
      <div class="spacer"></div>
      ${esGerente()?`<button class="btn ghost sm" onclick="formTrimestre()">
        ⊞ Cerrar trimestre</button>`:''}
      <button class="btn ghost sm" onclick="refrescarPrest()">↻ Recalcular</button>
      <button class="btn ghost sm" onclick="imprimirLiquidacion()">⎙ Imprimir</button>
      <button class="btn ghost sm" onclick="excelLiquidacion()">↧ Excel</button>
    </div>`}

  <div class="grid tiles" style="margin-bottom:16px">
    <div class="tile"><div class="lab">Garantía acumulada</div>
      <div class="val">${s?'Bs. '+k(s.capital):'—'}</div>
      <div class="meta">${s?'USD '+bs(s.capital/TASA)+' · art. 142 LOTTT':'Cargando…'}</div></div>
    <div class="tile"><div class="lab">Días acumulados</div>
      <div class="val">${s?(+s.dias).toFixed(0):'—'}</div>
      <div class="meta">Trimestrales + días adicionales</div></div>
    <div class="tile"><div class="lab">Anticipo disponible</div>
      <div class="val">${s?'Bs. '+k(s.anticipo_max):'—'}</div>
      <div class="meta">Hasta el 75 % · art. 144 LOTTT</div></div>
    <div class="tile"><div class="lab">Antigüedad</div>
      <div class="val">${s?s.anios:anios(e.ing)} <small>años</small></div>
      <div class="meta">Desde el ${fechaCorta(e.ing)}</div></div>
  </div>

  ${s&&s.sin_movimientos?`<div class="note wa" style="margin-bottom:16px"><span class="ni">⚑</span>
    <div>Este empleado <b>no tiene abonos de prestaciones registrados</b>. El simulador de abajo
    igual calcula lo que le tocaría, porque el artículo 142 manda pagar el mayor entre lo acumulado
    y los 30 días por año al último salario. ${esGerente()?
    'Para empezar a acumular, cierra los trimestres con el botón de arriba.':''}</div></div>`:''}

  <div class="card" style="margin-bottom:16px">
    <div class="card-h">
      <div><h3>Simulador de liquidación</h3>
        <p class="sub">${esc(e.n)} · ${esc(e.cargo)} · USD ${e.sal} al mes</p></div>
      <div class="spacer"></div>
      <select class="filtro" style="min-width:190px" onchange="PREST.motivo=this.value;refrescarPrest()">
        <option value="renuncia" ${PREST.motivo==='renuncia'?'selected':''}>Renuncia</option>
        <option value="despido_injustificado" ${PREST.motivo==='despido_injustificado'?'selected':''}>Despido injustificado</option>
        <option value="despido_justificado" ${PREST.motivo==='despido_justificado'?'selected':''}>Despido justificado</option>
      </select>
      <input type="date" class="fecha-inline" value="${PREST.fecha}"
        onchange="PREST.fecha=this.value;refrescarPrest()">
    </div>
    ${q?`<div class="tbl-wrap"><table>
      <thead><tr><th>Concepto</th><th>Fundamento</th>
        <th class="num">Bolívares</th><th class="num">USD</th></tr></thead>
      <tbody>${renglonesLiq(q).map(r=>`<tr>
        <td><b>${r[0]}</b></td>
        <td style="color:var(--ink-3);font-size:12.5px">${r[1]}</td>
        <td class="num">${bs(r[2])}</td><td class="num">${bs(r[2]/(q.tasa_bcv||TASA))}</td>
      </tr>`).join('')}
        <tr style="background:var(--sunken)"><td colspan="2"><b>Total a pagar</b></td>
          <td class="num"><b>${bs(q.total_liquidacion)}</b></td>
          <td class="num"><b>${bs(q.total_usd)}</b></td></tr>
      </tbody></table></div>
    <div class="card-b" style="border-top:1px solid var(--line-2)">
      <div class="stepnums">
        <span>Salario diario normal <b>Bs. ${bs(q.salario_diario_normal)}</b></span>
        <span>Salario diario integral <b>Bs. ${bs(q.salario_diario_integral)}</b></span>
        <span>Antigüedad <b>${q.antiguedad_anios} años y ${q.antiguedad_meses-q.antiguedad_anios*12} meses</b></span>
        <span>Tasa BCV <b>${bs(q.tasa_bcv)}</b></span>
      </div>
      ${+q.prestaciones_garantia>0 && +q.prestaciones_retroactivo>0 ? `
      <div class="note in" style="margin-top:12px"><span class="ni">◔</span><div>
        <b>Art. 142 lit. d:</b> se paga el mayor entre lo acumulado
        (Bs. ${bs(q.prestaciones_garantia)}) y los 30 días por año al último salario
        (Bs. ${bs(q.prestaciones_retroactivo)}). Aquí gana
        <b>${+q.prestaciones_retroactivo >= +q.prestaciones_garantia ? 'el retroactivo':'lo acumulado'}</b>.
      </div></div>`:''}
    </div>`
    :`<div class="empty"><b>Calculando…</b>Consultando el motor de liquidaciones.</div>`}
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-h"><div><h3>Prestaciones trimestrales</h3>
      <p class="sub">15 días de salario integral por trimestre · art. 142 lit. a LOTTT</p></div>
      <div class="spacer"></div>
      <button class="btn ghost sm" onclick="imprimirTabla('trimestrales')">⎙ Imprimir</button>
      <button class="btn ghost sm" onclick="excelTabla('trimestrales')">↧ Excel</button></div>
    ${PREST.trim===null?'<div class="empty"><b>Cargando…</b>Consultando los abonos.</div>'
     :PREST.trim.length?`<div class="tbl-wrap"><table>
      <thead><tr><th>Periodo</th><th class="num">Días</th><th class="num">Salario integral</th>
        <th class="num">Abono Bs.</th><th class="num">Intereses</th><th class="num">Acumulado</th></tr></thead>
      <tbody>${PREST.trim.map(t=>`<tr>
        <td><b>${esc(t.periodo)}</b></td>
        <td class="num">${(+t.dias).toFixed(2).replace('.',',')}</td>
        <td class="num">${bs(t.salario_integral)}</td>
        <td class="num">${bs(t.abono)}</td>
        <td class="num">${bs(t.intereses)}</td>
        <td class="num"><b>${bs(t.acumulado)}</b></td></tr>`).join('')}
      </tbody></table></div>`
     :`<div class="empty"><b>Sin trimestres cerrados</b>
        ${esGerente()?'Usa «Cerrar trimestre» para hacer el primer abono.'
                     :'La gerencia todavía no ha cerrado ningún trimestre.'}</div>`}
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-h"><div><h3>Fideicomiso de prestaciones</h3>
      <p class="sub">Movimiento con saldo corrido · lo que se le entrega al trabajador</p></div>
      <div class="spacer"></div>
      <button class="btn ghost sm" onclick="imprimirTabla('fideicomiso')">⎙ Imprimir</button>
      <button class="btn ghost sm" onclick="excelTabla('fideicomiso')">↧ Excel</button></div>
    ${PREST.fide===null?'<div class="empty"><b>Cargando…</b>Consultando el fideicomiso.</div>'
     :PREST.fide.length?`<div class="tbl-wrap"><table>
      <thead><tr><th>Fecha</th><th>Concepto</th><th>Detalle</th><th class="num">Días</th>
        <th class="num">Abono</th><th class="num">Retiro</th><th class="num">Saldo</th></tr></thead>
      <tbody>${PREST.fide.map(f=>`<tr>
        <td class="mono">${fechaCorta(f.fecha)}</td>
        <td><b>${esc(f.concepto)}</b></td>
        <td style="color:var(--ink-3);font-size:12.5px">${esc(f.detalle||'')}</td>
        <td class="num">${(+f.dias).toFixed(2).replace('.',',')}</td>
        <td class="num" style="color:var(--good)">${+f.abono?bs(f.abono):'—'}</td>
        <td class="num" style="color:var(--crit)">${+f.retiro?bs(f.retiro):'—'}</td>
        <td class="num"><b>${bs(f.saldo)}</b></td></tr>`).join('')}
      </tbody></table></div>`
     :`<div class="empty"><b>Sin movimientos</b>
        Este trabajador no tiene abonos ni retiros registrados en el fideicomiso.</div>`}
  </div>

  ${ROL()!=='empleado'&&PREST.pasivo?`<div class="card">
    <div class="card-h"><h3>Pasivo laboral acumulado</h3>
      <p class="sub">${tiendaFija()?nomTienda(tiendaFija()):'Toda la empresa'}</p></div>
    <div class="card-b">

/* El recibo de demostración desapareció: ahora todo se calcula desde el
   sueldo real del trabajador y la tasa cargada. Ver calcularRecibo(). */
window.TIPO_RECIBO = 'sueldo';

/* =====================================================================
   AJUSTES MANUALES DE NÓMINA
   Corregir una línea a mano es legítimo: el cálculo automático no
   siempre da lo que hace falta. Lo que no es legítimo es corregirla en
   silencio, así que todo ajuste pide un motivo escrito y conserva el
   monto original. La base de datos exige lo mismo (migración 014) y
   además impide tocar una nómina ya aprobada.
   ===================================================================== */
window.AJUSTES = {};

function ajustarNomina(empId, campo, valor){
  const v = parseFloat(valor);
  if(!isFinite(v) || v < 0){ aviso('Pon un monto válido'); pintar(); return; }
  const e = ESTADO.empleados.find(x=>x.id===empId);
  const A = AJUSTES[empId] || {};
  const previo = A.motivo || '';
  modal(`<div class="modal" style="max-width:480px"><div class="modal-h">
      <h3>Corregir la nómina de ${esc(e?e.n:'')}</h3>
      <button class="x" onclick="cancelarAjuste()">×</button></div>
    <div class="modal-b">
      <p style="font-size:14px">Vas a dejar las <b>${campo==='asig'?'asignaciones':'deducciones'}</b>
        en <b>Bs. ${bs(v)}</b>.</p>
      <div class="frow one"><div><label>¿Por qué?</label>
        <input id="aj_m" value="${esc(previo)}"
          placeholder="Ej.: se le pagó aparte el bono de inventario"></div></div>
      <div class="note wa"><span class="ni">⚑</span><div>
        El motivo se guarda con el ajuste y es lo que se le explica al trabajador
        y, si hace falta, al inspector. El monto calculado queda registrado aparte.</div></div>
    </div>
    <div class="modal-f"><button class="btn ghost sm" onclick="cancelarAjuste()">Cancelar</button>
      <button class="btn sm" style="width:auto"
        onclick="confirmarAjuste('${empId}','${campo}',${v})">Guardar el ajuste</button>
    </div></div>`);
}
function cancelarAjuste(){ cerrarModal(); pintar(); }
function confirmarAjuste(empId, campo, valor){
  const m = (document.getElementById('aj_m').value||'').trim();
  if(!m) return aviso('El ajuste necesita un motivo escrito');
  const A = AJUSTES[empId] || {};
  A[campo] = valor; A.motivo = m; A.por = SESION && SESION.nombre; A.cuando = new Date().toISOString();
  AJUSTES[empId] = A;
  cerrarModal(); pintar();
  aviso('Ajuste guardado · queda registrado quién y por qué');
}
function deshacerAjuste(empId){
  delete AJUSTES[empId];
  pintar(); aviso('Se restableció el cálculo automático');
}

async function guardarVigencia(){
  const g=k=>{const el=document.getElementById('v_'+k); return el?el.value.trim():''};
  const clave=(g('clave')||'').toUpperCase().replace(/\s+/g,'_');
  if(!clave) return aviso('Falta la clave');
  if(!g('desc')) return aviso('Falta la descripción');
  if(g('valor')==='') return aviso('Falta el valor');
  const b=document.getElementById('btnvig'); b.disabled=true; b.textContent='Guardando…';
  const r=await nuevaVigencia({clave, descripcion:g('desc'), valor:parseFloat(g('valor')),
    moneda:g('moneda'), unidad:g('unidad'), desde:g('desde'),
    gaceta:g('gaceta'), fundamento:g('fund')});
  b.disabled=false; b.textContent='Cargar vigencia';
  if(r){ cerrarModal(); pintar(); }
}

async function aplicarHorario(){
  const b=document.getElementById('btnhor'); b.disabled=true; b.textContent='Asignando…';
  const dias = document.getElementById('h_dias').value.split(',').map(Number);
  const n = await conError(()=>sb.rpc('asignar_horario_estandar', {
    p_nombre:'Horario de tienda',
    p_entrada:document.getElementById('h_ent').value,
    p_salida: document.getElementById('h_sal').value,
    p_dias: dias,
    p_almuerzo_inicio:document.getElementById('h_ai').value,
    p_almuerzo_fin:   document.getElementById('h_af').value,
    p_tienda: document.getElementById('h_tienda').value || null,
    p_desde: hoy(),
  }));
  b.disabled=false; b.textContent='Asignar este horario';
  if(n!==null){
    aviso(`${n} trabajador${n===1?'':'es'} con horario asignado`);
    await revisarHorarios(); pintar();
  }
}
async function revisarHorarios(){
  const r = await conError(()=>sb.rpc('sin_horario'));
  ESTADO.sinHorario = r || [];
}
async function aplicarEmpresa(){
  const g=k=>document.getElementById('e_'+k).value.trim();
  const util=parseInt(g('util'));
  if(util<30||util>120) return aviso('Los días de utilidades deben estar entre 30 y 120');
  const b=document.getElementById('btnemp'); b.disabled=true; b.textContent='Guardando…';
  await guardarEmpresa({nombre:g('nombre'), rif:g('rif'), razon_social:g('razon'),
    direccion_fiscal:g('dir'), telefono:g('tel'), email:g('email'),
    dias_utilidades:util, tolerancia_retardo_min:parseInt(g('tol'))||10,
    dias_vacaciones_base:parseInt(g('vac'))||15,
    dias_bono_vacacional_base:parseInt(g('bv'))||15});
  b.disabled=false; b.textContent='Guardar cambios'; pintar();
}

function coherenciaConcepto(){
  const car=document.getElementById('k_car'); if(!car) return;
  const noSal = car.value==='no_salarial';
  document.getElementById('k_aviso').style.display = noSal?'flex':'none';
  ['k_pre','k_uti'].forEach(id=>{
    const el=document.getElementById(id);
    if(noSal){ el.value='false'; el.disabled=true; el.style.opacity=.5; }
    else { el.disabled=false; el.style.opacity=1; }
  });
}
async function guardarConceptoUI(id){
  const g=k=>{const el=document.getElementById('k_'+k); return el?el.value.trim():''};

  if(!id && !g('cod')) return aviso('Falta el código');
  const b=document.getElementById('btnconc'); b.disabled=true; b.textContent='Guardando…';
  const d={nombre:g('nom'), caracter:g('car'), moneda:g('mon'),
    incide_prestaciones:g('pre')==='true', incide_utilidades:g('uti')==='true',
    incide_vacaciones:g('pre')==='true',
    prorratea:g('pro')==='true', activo:g('act')==='true', fundamento_legal:g('fun')||null};
  const r = id ? await guardarConcepto(id,d) : await crearConcepto({codigo:g('cod'),...d});
  b.disabled=false; b.textContent=id?'Guardar':'Crear';
  if(r){ cerrarModal(); pintar(); }
}

/* =====================================================================
   TABULADOR SALARIAL POR CARGO
   El sueldo base no es el mismo para un vendedor que para un encargado.
   Aquí se fija por cargo y se aplica a todos los que lo ocupan; el
   histórico de salarios sigue siendo la única verdad de lo que gana
   cada quien, y aplicar el tabulador abre una vigencia nueva.
   ===================================================================== */
function cfgCargos(){
  const C = ESTADO.cargos || [];
  const cuenta = id => ESTADO.empleados.filter(e=>e.cargo_id===id && e.est!=='egresado').length;
  return `<div class="card"><div class="card-h">
      <div><h3>Tabulador por cargo</h3>
        <p class="sub">Sueldo base, complemento alimentario y cestaticket de cada cargo, en dólares</p></div>
      <div class="spacer"></div>
      ${esGerente()?`<button class="btn ghost sm" onclick="formCargo()">+ Cargo</button>`:''}</div>
    ${C.length?`<div class="tbl-wrap"><table>
      <thead><tr><th>Cargo</th><th>Departamento</th><th class="num">Personas</th>
        <th class="num">Sueldo USD</th><th class="num">Complemento USD</th>
        <th class="num">Cestaticket USD</th><th class="num">Total USD</th>
        ${esGerente()?'<th></th>':''}</tr></thead>
      <tbody>${C.map(c=>{
        // Si el cargo no fija cestaticket rige el parámetro general de la empresa
        const cest = +c.cestaticket_usd>0 ? +c.cestaticket_usd : parLegal('CESTATICKET',0);
        const tot=(+c.salario_base_usd||0)+(+c.complemento_usd||0)+cest;
        const porc=tot? (+c.salario_base_usd||0)/tot*100 : 0;
        return `<tr>
        <td><b>${esc(c.nombre)}</b>${c.es_de_direccion?'<div class="mini">Trabajador de dirección · art. 37 LOTTT</div>':''}</td>
        <td>${esc(c.departamento||'—')}</td>
        <td class="num">${cuenta(c.id)}</td>
        <td class="num">${bs(c.salario_base_usd)}</td>
        <td class="num">${bs(c.complemento_usd)}</td>
        <td class="num">${bs(cest)}${+c.cestaticket_usd>0?'':'<div class="mini">del parámetro general</div>'}</td>
        <td class="num"><b>${bs(tot)}</b>
          <div class="mini" style="color:${porc<50?'var(--warn)':'var(--ink-3)'}">
            ${tot?porc.toFixed(0)+' % salario':'—'}</div></td>
        ${esGerente()?`<td><div class="acciones">
          <button class="iconbtn" title="Editar tabulador" onclick="formCargo('${c.id}')">✎</button>
          <button class="iconbtn" title="Aplicar a los ${cuenta(c.id)} trabajadores del cargo"
            onclick="confirmarTabulador('${c.id}')">⇩</button>
        </div></td>`:''}
      </tr>`}).join('')}
      </tbody></table></div>`
    :`<div class="empty"><b>Sin cargos</b>Crea el primero para poder armar el tabulador.</div>`}
    <div class="card-b" style="border-top:1px solid var(--line-2)">
      <div class="note wa"><span class="ni">⚑</span><div>
        La columna <b>% salario</b> dice cuánto de lo que se le paga a ese cargo es sueldo de
        verdad. Todo lo que va por complemento o cestaticket <b>no genera prestaciones,
        vacaciones ni utilidades</b>. Si ese porcentaje es bajo, el pasivo laboral se ve
        pequeño hoy pero cualquier reclamo se calcula sobre lo que debió ser salario.
        Es una decisión que conviene conversar con su abogado laboral.</div></div>
    </div></div>`;
}

  modal(`<div class="modal" style="max-width:540px"><div class="modal-h">
      <h3>${c?'Tabulador de '+esc(c.nombre):'Cargo nuevo'}</h3>

async function aplicarCargo(id){
  const d = {salario_base_usd:+document.getElementById('cg_s').value||0,
             complemento_usd: +document.getElementById('cg_c').value||0,
             cestaticket_usd: +document.getElementById('cg_k').value||0};
  let r;
  if(id) r = await guardarCargo(id, d);

function renglonesLiq(q){
  const R=[];
  const n = x => +(q[x]||0);
  R.push(['Prestaciones sociales','Art. 142 · el mayor entre lo acumulado y 30 días por año',
          n('prestaciones_a_pagar')]);
  if(n('intereses_prestaciones')>0)
    R.push(['Intereses sobre prestaciones','Art. 143 · tasa activa BCV', n('intereses_prestaciones')]);
  if(n('indemnizacion_art92')>0)
    R.push(['Indemnización por despido','Art. 92 · monto igual a las prestaciones', n('indemnizacion_art92')]);
  if(n('vacaciones_pendientes')>0)
    R.push(['Vacaciones vencidas no disfrutadas','Art. 190', n('vacaciones_pendientes')]);
  if(n('bono_vacacional_pendiente')>0)
    R.push(['Bono vacacional pendiente','Art. 192', n('bono_vacacional_pendiente')]);
  R.push(['Vacaciones fraccionadas','Art. 196 · proporción del año en curso', n('vacaciones_fraccionadas')]);
  R.push(['Bono vacacional fraccionado','Art. 192', n('bono_vacacional_fraccionado')]);
  R.push(['Utilidades fraccionadas','Art. 131 · meses trabajados del ejercicio', n('utilidades_fraccionadas')]);
  return R.filter(r=>r[2]>0);
}

    chipT.innerHTML = t
      ? `<span class="dot"></span>BCV <b>Bs. ${bs(TASA)}</b>`
      : `<span class="dot" style="background:var(--warn)"></span>BCV <b>sin cargar</b>`;
    chipT.title = t ? 'Tasa del '+fechaCorta(t.fecha)+' · '+(t.origen||'BCV')
                    : 'No hay ninguna tasa cargada. Configuración → Tasas BCV.';
    chipT.style.cursor='pointer';
    chipT.onclick = ()=>{ if(esGerente()){ window.TAB_CFG='tasas'; ir('config'); } };
  }
  document.getElementById('scopechip').innerHTML =
    `<span style="color:var(--ink-3)">Alcance</span> <b>${esc(alcance)}</b>`;
  const V = VISTAS[VISTA] || VISTAS.panel;
  document.getElementById('ptitle').textContent = V.t();
  document.getElementById('view').innerHTML = CARGANDO
    ? '<div class="empty"><b>Cargando…</b>Consultando la base de datos.</div>'
    : V.h();
  tablasComoFichas();
}
</script>
