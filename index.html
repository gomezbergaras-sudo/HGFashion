        <th>Ingreso</th><th class="num">Antigüedad</th><th class="num">Salario</th><th>Estado</th>
        ${admin?'<th></th>':''}</tr></thead>
      <tbody>${L.map((e,i)=>`<tr class="${admin?'click':''}" ${admin?`onclick="formEmpleado('${e.id}')"`:''}>
        <td><div class="who"><div class="av" style="background:${COL[i%4]}">${ini(e.n)}</div>
          <div><b>${esc(e.n)}</b></div></div></td>
        <td class="mono">V-${esc(e.ci)}</td><td>${esc(e.cargo)}</td>
        ${tiendaFija()?'':`<td><span class="pill nu">${esc(e.t)}</span></td>`}
        <td class="mono">${fechaCorta(e.ing)}</td>
        <td class="num">${anios(e.ing)} ${anios(e.ing)===1?'año':'años'}</td>
        <td class="num">${ver?'USD '+e.sal:'<span class="locked">restringido</span>'}</td>
        <td>${pillEstado(e.est)}</td>
        ${admin?`<td><div class="rowact">
          <button class="iconbtn" title="Editar" onclick="event.stopPropagation();formEmpleado('${e.id}')">✎</button>
          <button class="iconbtn del" title="Eliminar" onclick="event.stopPropagation();borrarEmpleado('${e.id}')">🗑</button>
        </div></td>`:''}</tr>`).join('')}
      </tbody></table></div>`
    :`<div class="empty"><b>Ningún empleado coincide</b>
       Prueba a quitar los filtros o cargar personal desde Excel.</div>`}
  </div>
  ${!ver?`<div class="note in" style="margin-top:14px"><span class="ni">◔</span>
    <div>La columna de salario está bloqueada por las reglas de acceso de la base de datos:
    <b>el dato nunca sale del servidor</b>.</div></div>`:''}`;
}},

tiendas:{ t:()=>'Tiendas', h:()=>{
  const admin=esGerente();
  const L = ESTADO.tiendas.filter(t=>!FILTRO.texto ||
    (t.nombre+' '+t.ciudad+' '+t.estado_pais+' '+t.codigo).toLowerCase().includes(FILTRO.texto.toLowerCase()));
  return `<div class="toolbar">
      <div class="search"><input placeholder="Buscar tienda, ciudad o estado…" value="${esc(FILTRO.texto)}"
        oninput="FILTRO.texto=this.value;pintar();const i=document.querySelector('.search input');
        if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}"></div>
      <div class="spacer"></div>
      <button class="btn ghost sm" onclick="recargar()">↻ Recargar</button>
      ${admin?`<button class="btn sm" style="width:auto" onclick="formTienda()">+ Nueva tienda</button>`:''}
    </div>
  <div class="grid tiles" style="margin-bottom:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
    <div class="tile"><div class="lab">Tiendas</div><div class="val">${ESTADO.tiendas.length}</div></div>
    <div class="tile"><div class="lab">Activas</div><div class="val">${ESTADO.tiendas.filter(t=>t.activa).length}</div></div>
    <div class="tile"><div class="lab">Personal total</div>
      <div class="val">${ESTADO.empleados.filter(e=>e.est!=='egresado').length}</div></div>
    <div class="tile"><div class="lab">Estados del país</div>
      <div class="val">${new Set(ESTADO.tiendas.map(t=>t.estado_pais).filter(Boolean)).size}</div></div>
  </div>
  <div class="card"><div class="card-h"><h3>Red de tiendas</h3>
    <p class="sub">Haz clic en una fila para ver solo a su personal</p></div>
    ${L.length?`<div class="tbl-wrap"><table>
      <thead><tr><th>Código</th><th>Tienda</th><th>Ciudad</th><th>Estado</th><th>Dirección</th>
        <th class="num">Personal</th><th>Situación</th>${admin?'<th></th>':''}</tr></thead>
      <tbody>${L.map(t=>{
        const n=ESTADO.empleados.filter(e=>e.tienda_id===t.id&&e.est!=='egresado').length;
        return `<tr class="click" onclick="FILTRO.tienda='${t.codigo}';FILTRO.texto='';ir('empleados')">
          <td><span class="pill nu">${esc(t.codigo)}</span></td>
          <td><b>${esc(t.nombre)}</b></td><td>${esc(t.ciudad||'—')}</td><td>${esc(t.estado_pais||'—')}</td>
          <td style="color:var(--ink-3);font-size:12.5px">${esc(t.direccion||'—')}</td>
          <td class="num">${n}</td>
          <td>${t.activa?'<span class="pill ok">Activa</span>':'<span class="pill nu">Inactiva</span>'}</td>
          ${admin?`<td><div class="rowact">
            <button class="iconbtn" title="Editar" onclick="event.stopPropagation();formTienda('${t.id}')">✎</button>
            <button class="iconbtn" title="${t.activa?'Desactivar':'Reactivar'}"
              onclick="event.stopPropagation();alternarTienda('${t.id}')">${t.activa?'◐':'◉'}</button>
            <button class="iconbtn del" title="Eliminar"
              onclick="event.stopPropagation();borrarTienda('${t.id}')">✕</button>
          </div></td>`:''}</tr>`}).join('')}
      </tbody></table></div>`
    :`<div class="empty"><b>Sin tiendas</b>${admin?'Crea la primera con el botón de arriba.':'Aún no hay tiendas registradas.'}</div>`}
  </div>`;
}},

asistencia:{ t:()=>ROL()==='empleado'?'Mi asistencia':'Control de asistencia', h:()=>{
  const emps=empleadosVisibles();
  const asis=emps.map(e=>ESTADO.asistencia[e.id]).filter(Boolean);
  const T = tiendaFija()?ESTADO.tiendas.filter(t=>t.codigo===tiendaFija())
          : FILTRO.tienda?ESTADO.tiendas.filter(t=>t.codigo===FILTRO.tienda):ESTADO.tiendas;
  const cisVis = new Set(emps.map(e=>e.ci));
  const marc = ESTADO.marcajes.filter(m=>cisVis.has(m.ci))
                 .sort((a,b)=> b.fecha.localeCompare(a.fecha) || a.nombre.localeCompare(b.nombre));
  return `${barraFiltros({conBusqueda:ROL()!=='empleado', acciones: ROL()!=='empleado'?
    `<button class="btn sm" style="width:auto" onclick="abrirImportador('asistencia')">
      ↥ Cargar marcajes desde Excel</button>`:''})}
  <div class="grid tiles" style="margin-bottom:16px;grid-template-columns:repeat(auto-fit,minmax(155px,1fr))">
    <div class="tile"><div class="lab">Presentes hoy</div>
      <div class="val">${asis.filter(a=>a.est==='presente').length}</div>
      <div class="meta">de ${asis.length} programados</div></div>
    <div class="tile warn"><div class="lab">Retardos</div>
      <div class="val">${asis.filter(a=>a.est==='retardo').length}</div>
      <div class="meta">Más allá de los 10 min de tolerancia</div></div>
    <div class="tile alert"><div class="lab">Ausencias</div>
      <div class="val">${asis.filter(a=>a.est==='ausente').length}</div>
      <div class="meta">Sin justificar</div></div>
    <div class="tile"><div class="lab">Marcajes cargados</div><div class="val">${marc.length}</div>
      <div class="meta">${marc.length?'Desde archivo':'Ninguno todavía'}</div></div>
  </div>
  <div class="card" style="margin-bottom:16px">
    <div class="card-h"><h3>Registrar marcaje</h3>
      <p class="sub">Funciona sin conexión y sincroniza al volver la señal</p></div>
    <div class="card-b" style="display:flex;gap:10px;flex-wrap:wrap">
      ${['entrada','salida a almuerzo','regreso','salida'].map(t=>
        `<button class="btn ghost sm" onclick="marcar('${t}')">◷ ${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}
    </div></div>
  ${tablaAsistencia(emps)}
  ${marc.length?`<div class="card" style="margin-top:16px">
    <div class="card-h"><h3>Marcajes cargados desde archivo</h3>
      <p class="sub">${marc.length} registro${marc.length===1?'':'s'} · el almuerzo ya está descontado</p>
      <div class="spacer"></div>
      <button class="btn ghost sm" onclick="ESTADO.marcajes=[];aviso('Marcajes borrados');pintar()">
        Limpiar</button></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Fecha</th><th>Empleado</th>${tiendaFija()?'':'<th>Tienda</th>'}
        <th>Entrada</th><th>Sale almuerzo</th><th>Regresa</th><th>Salida</th>
        <th class="num">Almuerzo</th><th class="num">Horas</th><th>Estado</th></tr></thead>
      <tbody>${marc.slice(0,80).map((m,i)=>`<tr>
        <td class="mono">${fechaCorta(m.fecha)}</td>
        <td><div class="who"><div class="av" style="background:${COL[i%4]}">${ini(m.nombre)}</div>
          <div><b>${esc(m.nombre)}</b></div></div></td>
        ${tiendaFija()?'':`<td><span class="pill nu">${esc(m.tienda)}</span></td>`}
        <td class="mono">${esc(m.ent||'—')}</td><td class="mono">${esc(m.salAlm||'—')}</td>
        <td class="mono">${esc(m.regAlm||'—')}</td><td class="mono">${esc(m.sal||'—')}</td>
        <td class="num">${m.almuerzo?m.almuerzo+'′':'—'}</td>
        <td class="num"><b>${m.horas.toFixed(2).replace('.',',')}</b></td>
        <td>${m.retardo>0?`<span class="pill wa">Retardo ${m.retardo}′</span>`
             :'<span class="pill ok">Puntual</span>'}</td></tr>`).join('')}
      </tbody></table></div></div>`:''}
  ${ROL()!=='empleado'?`<div class="card" style="margin-top:16px">
    <div class="card-h"><h3>Ausentismo por tienda</h3>
      <p class="sub">Porcentaje de días programados no trabajados · agosto</p></div>
    <div class="card-b">${barrasH(T.map(t=>({l:t.nombre,v:ausTienda(t.codigo),
      c:ausTienda(t.codigo)>5?'var(--crit)':ausTienda(t.codigo)>3?'var(--warn)':'var(--c1)',
      tip:ausTienda(t.codigo)+' % de ausentismo'})),{fmt:v=>v.toFixed(1).replace('.',',')+' %'})}
      <div class="lgd"><span><i style="background:var(--c1)"></i>Bajo · hasta 3 %</span>
        <span><i style="background:var(--warn)"></i>Medio · 3 a 5 %</span>
        <span><i style="background:var(--crit)"></i>Alto · más de 5 %</span></div>
    </div></div>`:''}`;
}},

incidencias:{ t:()=>ROL()==='empleado'?'Mis solicitudes':'Incidencias', h:()=>{
  const puede = esGerente()||ROL()==='supervisor_tienda';
  let L=ESTADO.incidencias;
  if(tiendaFija()) L=L.filter(i=>i.t===tiendaFija());
  if(FILTRO.tienda) L=L.filter(i=>i.t===FILTRO.tienda);
  if(ROL()==='empleado') L=L.filter(i=>i.n===R().n);
  if(FILTRO.texto){const q=FILTRO.texto.toLowerCase();
    L=L.filter(i=>(i.n+' '+i.tipo+' '+i.mot).toLowerCase().includes(q));}
  return `${barraFiltros({acciones:`<button class="btn sm" style="width:auto" onclick="formIncidencia()">
      + ${ROL()==='empleado'?'Solicitar permiso':'Nueva incidencia'}</button>`})}
  ${ROL()==='supervisor_auxiliar'?`<div class="note wa" style="margin-bottom:16px"><span class="ni">⚑</span>
    <div>Puedes <b>reportar</b> incidencias, pero la aprobación corresponde al supervisor
    de tienda o a la gerencia.</div></div>`:''}
  <div class="card"><div class="card-h"><h3>${ROL()==='empleado'?'Mis solicitudes':'Bandeja de incidencias'}</h3>
    <p class="sub">${L.filter(i=>i.est==='pendiente').length} pendiente${L.filter(i=>i.est==='pendiente').length===1?'':'s'}</p></div>
    ${L.length?`<div class="tbl-wrap"><table>
      <thead><tr><th>Empleado</th>${tiendaFija()?'':'<th>Tienda</th>'}<th>Tipo</th><th>Desde</th><th>Hasta</th>
        <th>Motivo</th><th>Estado</th>${puede?'<th></th>':''}</tr></thead>
      <tbody>${L.map((x,i)=>`<tr>
        <td><div class="who"><div class="av" style="background:${COL[i%4]}">${ini(x.n)}</div>
          <div><b>${esc(x.n)}</b></div></div></td>
        ${tiendaFija()?'':`<td><span class="pill nu">${esc(x.t)}</span></td>`}
        <td>${esc(x.tipo)}</td><td class="mono">${fechaCorta(x.desde)}</td><td class="mono">${fechaCorta(x.hasta)}</td>
        <td style="color:var(--ink-3);font-size:12.5px;max-width:220px">${esc(x.mot)}</td>
        <td>${x.est==='pendiente'?'<span class="pill wa">Pendiente</span>'
             :x.est==='aprobada'?'<span class="pill ok">Aprobada</span>'
             :'<span class="pill cr">Rechazada</span>'}</td>
        ${puede?`<td><div class="rowact">${x.est==='pendiente'?
          `<button class="btn ghost sm" onclick="resolverInc('${x.id}',true)">Aprobar</button>
           <button class="iconbtn del" title="Rechazar" onclick="resolverInc('${x.id}',false)">×</button>`
          :''}</div></td>`:''}</tr>`).join('')}
      </tbody></table></div>`
    :`<div class="empty"><b>Sin incidencias</b>No hay registros que coincidan con los filtros.</div>`}
  </div>`;
}},

nomina:{ t:()=>ROL()==='supervisor_tienda'?'Nómina de mi tienda':'Procesar nómina', h:()=>{
  const L=empleadosVisibles().filter(e=>e.est!=='egresado');
  const ap=ESTADO.nominaAprobada;
  const filas=L.map(e=>{const asig=e.sal*TASA*0.5+e.sal*TASA*1.0;
    const ded=asig*0.0041, neto=asig-ded; return {e,asig,ded,neto,sal:asig*0.358};});
  const T={asig:filas.reduce((a,f)=>a+f.asig,0), ded:filas.reduce((a,f)=>a+f.ded,0),
           neto:filas.reduce((a,f)=>a+f.neto,0)};
  return `${barraFiltros({conBusqueda:false})}
  <div class="steps">
    <div class="step done"><div class="n">PASO 1 ✓</div><b>Corte de asistencia</b></div>
    <div class="step done"><div class="n">PASO 2 ✓</div><b>Aprobar pendientes</b></div>
    <div class="step done"><div class="n">PASO 3 ✓</div><b>Cálculo</b></div>
    <div class="step ${ap?'done':'now'}"><div class="n">PASO 4${ap?' ✓':''}</div>
      <b>${ap?'Aprobada':(esGerente()?'Aprobación final':'Revisión')}</b></div>
  </div>
  <div class="grid tiles" style="margin-bottom:16px">
    <div class="tile"><div class="lab">Periodo</div><div class="val" style="font-size:20px">16 – 31 ago</div>
      <div class="meta">Quincenal · pago el 31/08/2026</div></div>
    <div class="tile"><div class="lab">Tasa BCV congelada</div><div class="val">250<small>,00</small></div>
      <div class="meta">Bs. por dólar · fijada al calcular</div></div>
    <div class="tile"><div class="lab">Total neto</div><div class="val">Bs. ${k(T.neto)}</div>
      <div class="meta">USD ${k(T.neto/TASA)} · ${L.length} empleados</div></div>
    <div class="tile"><div class="lab">Costo total empresa</div><div class="val">Bs. ${k(T.neto*1.05)}</div>
      <div class="meta">Incluye aportes patronales</div></div>
  </div>
  <div class="card" style="margin-bottom:16px">
    <div class="card-h"><h3>Detalle por empleado</h3>
      <p class="sub">${FILTRO.tienda?nomTienda(FILTRO.tienda):tiendaFija()?nomTienda(tiendaFija()):'Consolidado'}</p>
      <div class="spacer"></div>${ap?'<span class="pill ok">Aprobada</span>':'<span class="pill in">Calculada</span>'}</div>
    ${filas.length?`<div class="tbl-wrap"><table>
      <thead><tr><th>Empleado</th>${tiendaFija()?'':'<th>Tienda</th>'}<th class="num">Días</th>
        <th class="num">Asignaciones</th><th class="num">Deducciones</th><th class="num">Neto Bs.</th>
        <th class="num">Neto USD</th><th class="num">Base prestaciones</th></tr></thead>
      <tbody>${filas.map((f,i)=>`<tr class="click" onclick="ir('recibos')">
        <td><div class="who"><div class="av" style="background:${COL[i%4]}">${ini(f.e.n)}</div>
          <div><b>${esc(f.e.n)}</b><span>${esc(f.e.cargo)}</span></div></div></td>
        ${tiendaFija()?'':`<td><span class="pill nu">${esc(f.e.t)}</span></td>`}
        <td class="num">16</td><td class="num">${bs(f.asig)}</td><td class="num">${bs(f.ded)}</td>
        <td class="num"><b>${bs(f.neto)}</b></td><td class="num">${bs(f.neto/TASA)}</td>
        <td class="num" style="color:var(--brand)">${bs(f.sal)}</td></tr>`).join('')}
      </tbody></table></div>`:'<div class="empty"><b>Sin empleados</b>Ajusta los filtros.</div>'}</div>
  ${esGerente()?(ap?`<div class="note ok" style="background:var(--good-soft);border-color:transparent">
      <span class="ni" style="color:var(--good)">✓</span><div><b>Nómina aprobada y sellada.</b>
      Los recibos ya están disponibles para los trabajadores. Cualquier corrección exige
      una nómina de ajuste retroactivo.</div></div>`
    :`<div class="card"><div class="card-b" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <div style="flex:1;min-width:220px"><b>Aprobar esta nómina</b>
        <p style="font-size:13px;color:var(--ink-3)">Una vez aprobada queda sellada.</p></div>
      <button class="btn ghost sm" onclick="aviso('Nómina devuelta a revisión')">Devolver a revisión</button>
      <button class="btn sm" style="width:auto" onclick="aprobarNomina()">Aprobar y generar recibos</button>

  if(!SESION) return;
  const r=R();
  const menu = MENU[ROL()] || MENU.empleado;
  const pendientes = ESTADO.incidencias.filter(i=>i.est==='pendiente'
    && (!r.t || i.t===r.t)).length;
  document.getElementById('nav').innerHTML = menu.map(m=>
    m[0]==='g' ? `<div class="navgrp">${m[1]}</div>`
    : `<button class="navitem ${VISTA===m[0]?'on':''}" onclick="ir('${m[0]}')">
         <span class="ic">${m[2]}</span><span>${m[1]}</span>
         ${m[0]==='incidencias'&&pendientes?`<span class="badge">${pendientes}</span>`:''}
       </button>`).join('');
  document.getElementById('userbox').innerHTML =
    `<div class="av" style="background:${r.av}">${ini(r.n)}</div>
     <div><b>${esc(r.n)}</b><span>${esc(r.r)}</span></div>`;
  const alcance = r.t ? nomTienda(r.t)
    : FILTRO.tienda ? nomTienda(FILTRO.tienda)
    : ESTADO.tiendas.length ? `Las ${ESTADO.tiendas.length} tiendas` : 'Sin tiendas';
  document.getElementById('scopechip').innerHTML =
    `<span style="color:var(--ink-3)">Alcance</span> <b>${esc(alcance)}</b>`;
  const V = VISTAS[VISTA] || VISTAS.panel;
  document.getElementById('ptitle').textContent = V.t();
  document.getElementById('view').innerHTML = CARGANDO
    ? '<div class="empty"><b>Cargando…</b>Consultando la base de datos.</div>'
    : V.h();
}
</script>
