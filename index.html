.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--line);width:auto}
.btn.ghost:hover{background:var(--sunken)}
.btn.sm{padding:5px 11px;font-size:13px;width:auto}
.roles{margin-top:22px;padding-top:20px;border-top:1px solid var(--line-2)}

.tbl-wrap{overflow-x:auto}

th.num,td.num{text-align:right;font-family:"IBM Plex Mono","SFMono-Regular",monospace;
  font-size:12.5px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
td.num{color:var(--ink);font-weight:400}
td.num b{font-weight:600}

.who b{display:block;font-weight:600;font-size:13.5px;line-height:1.25}
.who span{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.25}
.locked{color:var(--ink-4);font-style:italic;font-size:12.5px}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}

.note{border-radius:var(--r);padding:13px 16px;font-size:13.5px;display:flex;gap:11px;
  align-items:flex-start;border:1px solid var(--line);background:var(--surface)}
.note.cr{background:var(--crit-soft);border-color:transparent}
.note.wa{background:var(--warn-soft);border-color:transparent}
.note.in{background:var(--info-soft);border-color:transparent}
.note .ni{font-weight:700;flex-shrink:0}
.note b{font-weight:700}

.steps{display:flex;gap:0;margin-bottom:22px;border:1px solid var(--line);border-radius:var(--r);

.recibo .rh b{display:block;font-family:"Playfair Display",Georgia,serif;font-size:15.5px;letter-spacing:.01em}

.empty{padding:50px 20px;text-align:center;color:var(--ink-3)}

  font-weight:500;z-index:400;transition:transform .22s cubic-bezier(.2,.8,.3,1);
  box-shadow:0 8px 28px -8px rgba(0,0,0,.4);max-width:88vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}

.rowact{display:flex;gap:5px;justify-content:flex-end}
.iconbtn{width:28px;height:28px;border-radius:5px;display:grid;place-items:center;
  color:var(--ink-3);font-size:14px;transition:background .12s,color .12s}
.iconbtn:hover{background:var(--sunken);color:var(--ink)}
.iconbtn.del:hover{background:var(--crit-soft);color:var(--crit)}
.previewtbl{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.previewtbl table{min-width:0}
.previewtbl td{padding:5px 8px}
/* Celdas editables dentro de una vista previa o de la nómina */
.celda{width:100%;min-width:0;padding:5px 7px;font-size:13px;font-family:inherit;
  border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink)}
.celda:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.celda.num{text-align:right;font-variant-numeric:tabular-nums}
.celda.vacia{border-color:var(--warn);background:var(--warn-soft)}
.impbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0;padding:10px 12px;
  background:var(--sunken);border:1px solid var(--line);border-radius:8px;font-size:13px}
.impbar span{color:var(--ink-2)}
/* Fila de nómina corregida a mano */
/* Los controles de la cabecera de una tarjeta no deben empujar la página */
.card-h{flex-wrap:wrap}
.fecha-inline{width:auto;max-width:100%;min-width:0}
@media (max-width:560px){ .fecha-inline{width:100%} .card-h .filtro{max-width:100%} }
tr.ajustada{background:var(--warn-soft)}
tr.ajustada td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.bad{background:var(--crit-soft)}
.stepnums{display:flex;gap:20px;font-size:13px;color:var(--ink-3);margin-bottom:14px;flex-wrap:wrap}
.stepnums b{color:var(--ink);font-family:"IBM Plex Mono",monospace}
</style>

<style>
/* ============ Recibos imprimibles y usuarios ============ */
.reciboLista{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.rcard{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--surface);
  cursor:pointer;transition:border-color .15s,box-shadow .15s}
.rcard:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.rcard .rn{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.rcard b{display:block;font-size:14.5px;margin:3px 0 2px}
.rcard .rm{font-size:12.5px;color:var(--ink-3)}
.rcard .rv{font-family:"Playfair Display",Georgia,serif;font-size:19px;font-weight:600;margin-top:8px}
.rcard .chk{float:right;width:17px;height:17px;border:1.5px solid var(--line);border-radius:4px;
  display:grid;place-items:center;font-size:11px;color:#fff}
.rcard.sel{border-color:var(--brand);background:var(--brand-soft)}
.rcard.sel .chk{background:var(--brand);border-color:var(--brand)}

#printzone{display:none}
@media print{
  body>*{display:none!important}
  #printzone{display:block!important}
  @page{size:A4;margin:12mm}
  .hoja{page-break-after:always;padding:0 0 8mm}
  .hoja:last-child{page-break-after:auto}
}
#printzone .hoja{max-width:190mm;margin:0 auto 10mm;font-family:"DM Sans",sans-serif;color:#111}
#printzone .ph{display:flex;gap:14px;align-items:center;border-bottom:2px solid #111;padding-bottom:10px}
#printzone .ph img{width:52px;height:52px;border-radius:50%}
#printzone .ph b{font-family:"Playfair Display",serif;font-size:16px;display:block}
#printzone .ph span{font-size:11px;color:#555;display:block;line-height:1.4}
#printzone .pt{text-align:right;margin-left:auto;font-size:11px;color:#555}
#printzone .pt strong{display:block;font-size:13px;color:#111;font-family:"IBM Plex Mono",monospace}
#printzone .calc{display:block;font-size:9.5px;color:#666;font-family:"IBM Plex Mono",monospace;
  line-height:1.4;margin-top:1px}
#printzone table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:12px}
#printzone td,#printzone th{padding:5px 8px;border-bottom:1px solid #ddd;text-align:left}
#printzone th{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#555;
  border-bottom:1px solid #111}
#printzone .r{text-align:right;font-family:"IBM Plex Mono",monospace}
#printzone .sec{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:#111;
  font-weight:700;margin-top:14px;border-bottom:1px solid #111;padding-bottom:3px}
#printzone .neto{background:#eee;font-weight:700}
#printzone .firma{margin-top:34px;display:flex;gap:40px}
#printzone .firma div{flex:1;border-top:1px solid #111;padding-top:5px;font-size:10.5px;text-align:center}
#printzone .datos{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;font-size:11.5px;margin-top:12px}
#printzone .datos span{color:#555}

.pillrol{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:2px 9px;border-radius:11px;background:var(--sunken);color:var(--ink-2)}
.pillrol.g{background:var(--brand-soft);color:var(--brand)}
.mini{font-size:12px;color:var(--ink-3);margin-top:2px}
.tipo-sw{display:flex;gap:2px;background:var(--sunken);padding:3px;border-radius:8px;margin-bottom:16px}
.tipo-sw button{flex:1;padding:7px 12px;border-radius:6px;font-size:13.5px;font-weight:600;
  color:var(--ink-3)}
.tipo-sw button.on{background:var(--surface);color:var(--brand);box-shadow:var(--shadow-sm)}
</style>

<style>
/* =====================================================================
   TELÉFONO Y TABLET
   El menú lateral pasa a ser un panel que entra desde la izquierda,
   las tablas se vuelven fichas apiladas y los modales ocupan la pantalla.
   ===================================================================== */
.hamb{display:none;width:38px;height:38px;border-radius:8px;align-items:center;
  justify-content:center;font-size:19px;color:var(--ink-2);flex-shrink:0}
.hamb:hover{background:var(--sunken)}
.velo{display:none;position:fixed;inset:0;background:rgba(19,34,39,.42);z-index:59}
.velo.on{display:block}

@media(max-width:1024px){
  #app.on{grid-template-columns:190px 1fr}
  .wrap{padding:20px 18px 60px}
  header.top{padding:0 18px}
}

@media(max-width:820px){
  #app.on{grid-template-columns:1fr}
  aside{position:fixed;top:0;left:0;bottom:0;width:250px;z-index:60;
    transform:translateX(-100%);transition:transform .22s cubic-bezier(.2,.8,.3,1);
    flex-direction:column;height:100vh;overflow-y:auto;box-shadow:0 0 40px rgba(0,0,0,.18)}
  aside.abierto{transform:translateX(0)}
  aside .brandrow{border-bottom:1px solid var(--line-2);border-right:0}
  nav{display:block;padding:12px 10px}
  .navgrp,.userbox{display:block}
  .navitem{margin-bottom:2px;padding:10px 12px;font-size:15px}
  .hamb{display:flex}

  header.top{padding:0 14px;gap:10px;height:54px;position:sticky}
  header.top h1{font-size:17px;flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  header.top .spacer{display:none}
  header.top .chip{display:none}
  header.top .chip#scopechip{display:inline-flex;max-width:44vw;overflow:hidden}
  header.top #scopechip span{display:none}

  .wrap{padding:16px 14px 70px}
  .grid.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile{padding:13px 14px}
  .tile .val{font-size:25px}
  .tile .lab{font-size:9.5px;letter-spacing:.1em}
  .tile .meta{font-size:11.5px}

  .grid[style*="grid-template-columns"]{grid-template-columns:minmax(0,1fr)!important}
  .toolbar{gap:8px}
  .search{max-width:none;flex:1 1 100%}
  select.filtro{flex:1 1 45%;min-width:0}
  .toolbar .btn{flex:1 1 auto}
  .toolbar .spacer{display:none}

  .modal-bg{padding:0;align-items:stretch}
  .modal,.modal.wide{max-width:none;border-radius:0;min-height:100vh;
    display:flex;flex-direction:column}
  .modal-h{position:sticky;top:0;background:var(--surface);z-index:2}
  .modal-b{flex:1;overflow-y:auto}
  .modal-f{position:sticky;bottom:0;background:var(--surface);
    box-shadow:0 -4px 12px -8px rgba(0,0,0,.25)}
  .modal-f .btn{flex:1}
  .frow{grid-template-columns:1fr}

  .steps{flex-direction:column}
  .step{border-right:0;border-bottom:1px solid var(--line-2);min-width:0}
  .step:last-child{border-bottom:0}
  .tabs{gap:0}
  .tab{padding:9px 12px;font-size:13.5px}
  .recibo{max-width:none}
  .reciboLista{grid-template-columns:repeat(auto-fill,minmax(0,1fr))}

  /* Tablas como fichas: cada fila se lee de arriba abajo */
  table.fichas{min-width:0}
  table.fichas thead{display:none}
  table.fichas,table.fichas tbody,table.fichas tr,table.fichas td{display:block;width:100%}
  table.fichas tr{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;
    padding:12px 14px;background:var(--surface)}
  table.fichas tr:last-child{margin-bottom:0}
  table.fichas td{border:0;padding:3px 0;display:flex;justify-content:space-between;
    align-items:center;gap:14px;text-align:right}
  table.fichas td::before{content:attr(data-et);flex-shrink:0;text-align:left;
    font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
    font-weight:700}
  table.fichas td:first-child{display:block;text-align:left;padding-bottom:9px;
    margin-bottom:7px;border-bottom:1px solid var(--line-2)}
  table.fichas td:first-child::before{display:none}
  table.fichas td.num{justify-content:space-between}
  table.fichas td:empty{display:none}
  .tbl-wrap{overflow:visible;border:0;background:none;box-shadow:none}
  .rowact{justify-content:flex-start;margin-top:8px}
  .iconbtn{width:36px;height:36px;border:1px solid var(--line)}
}

@media(max-width:359px){
  .grid.tiles{grid-template-columns:1fr}
}
@media(max-width:420px){
  .wrap{padding:14px 12px 70px}
  .tile .val{font-size:23px}
  .tile{padding:11px 12px}
  .toolbar .btn{flex:1 1 100%}
}

/* Pantallas táctiles: objetivos más grandes */
@media(hover:none){
  .navitem,.tab,.btn{min-height:40px}
  .rcard{padding:16px}
}
</style>

<script>
/* =====================================================================
   CONEXIÓN CON SUPABASE
   La anon key es pública por diseño: va en el navegador y lo que protege
   los datos son las políticas RLS, no el secreto de esta clave.
   ===================================================================== */
const CFG = {
  url: (typeof SUPABASE_URL!=='undefined' && SUPABASE_URL)      || localStorage.getItem('sb_url') || '',
  key: (typeof SUPABASE_ANON_KEY!=='undefined' && SUPABASE_ANON_KEY) || localStorage.getItem('sb_key') || '',
};
// Si la clave viene escrita en el archivo, manda esa: así una copia guardada
// en el navegador nunca tapa la configuración oficial del sitio.
const CLAVE_EN_ARCHIVO = typeof SUPABASE_ANON_KEY!=='undefined' && !!SUPABASE_ANON_KEY;
let sb = null;
function conectar(){
  if(!CFG.url || !CFG.key) return false;
  try{ sb = window.supabase.createClient(CFG.url, CFG.key); return true; }
  catch(e){ console.error(e); return false; }
}

/* =====================================================================
   ESTADO — se llena desde Supabase al iniciar sesión
   ===================================================================== */
/* La tasa NO es una constante: se lee siempre de la última que se cargó en
   Configuración → Tasas BCV. Si no hay ninguna cargada usa 250 para no
   romper la pantalla, pero el cálculo real de nómina lo hace la base de
   datos, que sí se niega a calcular sin tasa del día. */
/* ESTADO se declara con const, así que NO es una propiedad de window:
   hay que nombrarlo directo. El try cubre el instante entre que se define
   esta propiedad y que ESTADO existe. */
function tasaHoy(){
  try{ return (ESTADO.tasas && ESTADO.tasas[0]) || null; }catch(e){ return null; }
}
Object.defineProperty(window,'TASA',{ configurable:true, get(){
  const t = tasaHoy();
  const v = t ? +t.tasa_usd : 0;
  return v > 0 ? v : 250;
}});
const bs  = n => (+n||0).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});
const bs4 = n => (+n||0).toLocaleString('es-VE',{minimumFractionDigits:4,maximumFractionDigits:4});
/* Porcentaje con coma decimal, como se escribe en Venezuela */
const pct = (f,d=1) => (+f*100).toFixed(d).replace('.',',');
const num = (n,d=2) => (+n||0).toFixed(d).replace('.',',');
const k   = n => n>=1e6 ? (n/1e6).toFixed(1).replace('.',',')+' M'
                : n>=1e3 ? Math.round(n/1e3)+' K' : Math.round(n);
const ini = s => (s||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const COL = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)'];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = (()=>{let n=1000;return ()=>'tmp'+(++n)})();

const ESTADO = {
 empresa:null, tiendas:[], empleados:[], cargos:[], usuarios:[],
 asistencia:{}, marcajes:[], incidencias:[], nominaAprobada:false,
 param:[], paramRaw:[], conceptos:[], tasas:[], auditoria:[], sinHorario:[],
};

/* Lee un parámetro legal vigente por su clave. Devuelve el número crudo.
   Nunca se escribe un valor legal a mano en el código: todos viven en la
   tabla parametros_legales, con su fecha de vigencia y su gaceta. */
function parLegal(clave, porDefecto){
  try{
    const p = (ESTADO.paramRaw||[]).find(x=>x.clave===clave);
    return p ? +p.valor : porDefecto;
  }catch(e){ return porDefecto; }
}

const ROL_ET = {gerente_general:'Gerente General', supervisor_tienda:'Supervisor de Tienda',
  supervisor_auxiliar:'Supervisor Auxiliar', empleado:'Empleado'};

/* Sesión real: se llena con el perfil que devuelve la base de datos */
let SESION = null;         // {id, nombre, email, rol, tienda_id, tienda_codigo}
let VISTA='panel';
let FILTRO={tienda:'', texto:'', estado:''};
let CARGANDO=false;

const R = () => ({
  n: SESION?.nombre || '—',
  r: ROL_ET[SESION?.rol] || '—',
  av: {gerente_general:'var(--brand)', supervisor_tienda:'var(--c2)',
       supervisor_auxiliar:'var(--c3)', empleado:'var(--c4)'}[SESION?.rol] || 'var(--ink-3)',
  t: SESION?.tienda_codigo || null,
  salarios: SESION?.rol==='gerente_general' ? true
          : SESION?.rol==='supervisor_tienda' ? true
          : SESION?.rol==='empleado' ? 'propio' : false,
  admin: SESION?.rol==='gerente_general',
});
const ROL = () => SESION?.rol;
const esGerente = () => SESION?.rol==='gerente_general';

const tiendaFija = () => R().t;
const nomTienda = cod => (ESTADO.tiendas.find(t=>t.codigo===cod)||{}).nombre || cod || '—';
const tiendaUUID = cod => (ESTADO.tiendas.find(t=>t.codigo===cod)||{}).id || null;

function empleadosVisibles(){
  let L = ESTADO.empleados.slice();
  if(tiendaFija()) L = L.filter(e=>e.t===tiendaFija());
  if(ROL()==='empleado') L = L.filter(e=>e.usuario_id===SESION.id);
  if(FILTRO.tienda) L = L.filter(e=>e.t===FILTRO.tienda);
  if(FILTRO.estado) L = L.filter(e=>e.est===FILTRO.estado);
  if(FILTRO.texto){
    const q = FILTRO.texto.toLowerCase();
    L = L.filter(e=>(e.n+' '+e.ci+' '+e.cargo+' '+nomTienda(e.t)).toLowerCase().includes(q));
  }
  return L;
}
const anios = ing => { const d=new Date(ing);
  return isNaN(d)?0:Math.max(0,Math.floor((Date.now()-d)/31557600000)); };
const fechaCorta = f => { if(!f) return '—'; const [a,m,d]=String(f).slice(0,10).split('-');
  return d?`${d}/${m}/${a}`:f; };
const hoy = () => new Date().toISOString().slice(0,10);

/* =====================================================================
   AVISOS Y MODALES
   ===================================================================== */
let _toastT;
function aviso(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(_toastT); _toastT=setTimeout(()=>t.classList.remove('on'),3200);
}
function modal(html){
  document.getElementById('modalhost').innerHTML =
    `<div class="modal-bg" onclick="if(event.target===this)cerrarModal()">${html}</div>`;
  document.body.style.overflow='hidden';
  const f=document.querySelector('.modal input,.modal select,.modal textarea'); if(f)f.focus();
}
function cerrarModal(){
  document.getElementById('modalhost').innerHTML='';
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') cerrarModal(); });

/* Errores de Supabase traducidos a algo que se pueda leer */
function explicar(error){
  if(!error) return '';
  const m = error.message || String(error);
  if(/Invalid login credentials/i.test(m)) return 'Correo o contraseña incorrectos';
  if(/Email not confirmed/i.test(m)) return 'Falta confirmar el correo: revisa tu bandeja de entrada';
  if(/duplicate key.*cedula/i.test(m)) return 'Ya existe un empleado con esa cédula';
  if(/duplicate key.*codigo/i.test(m)) return 'Ya existe una tienda con ese código';
  if(/violates row-level security/i.test(m)) return 'Tu rol no tiene permiso para hacer esto';
  if(/violates foreign key/i.test(m)) return 'Hay registros que dependen de este dato';
  if(/Failed to fetch|NetworkError/i.test(m)) return 'Sin conexión con la base de datos';
  if(/JWT|expired/i.test(m)) return 'Tu sesión expiró: vuelve a entrar';
  return m;
}
async function conError(fn, exito){
  try{
    const { data, error } = await fn();
    if(error) throw error;
    if(exito) aviso(exito);
    return data;
  }catch(e){ aviso(explicar(e)); return null; }
}
function auditar(){}   /* la auditoría real la escriben los triggers de la base */
</script>
<script>
/* =====================================================================
   ACCESO A DATOS — todo pasa por Supabase con la sesión del usuario
   ===================================================================== */

async function cargarTodo(){
  CARGANDO=true; pintar();
  const [emp, tie, car, emps, sal, usr, par, con, tas] = await Promise.all([
    sb.from('empresas').select('*').limit(1).maybeSingle(),
    sb.from('tiendas').select('*').order('codigo'),
    sb.from('cargos').select('*').order('nombre'),
    sb.from('empleados').select('*').order('primer_apellido'),
    sb.from('historial_salarios').select('empleado_id,salario_base,moneda_salario,vigente_desde,vigente_hasta'),
    sb.from('v_usuarios').select('*'),
    sb.from('parametros_legales').select('*').is('vigente_hasta',null).order('clave'),
    sb.from('conceptos_nomina').select('*').order('orden'),
    sb.from('tasas_cambio').select('*').order('fecha',{ascending:false}).limit(60),
  ]);

  ESTADO.empresa  = emp.data || null;
  ESTADO.tiendas  = tie.data || [];
  ESTADO.cargos   = car.data || [];
  ESTADO.usuarios = usr.data || [];
  ESTADO.paramRaw = par.data || [];
  ESTADO.param    = (par.data||[]).map(p=>[p.descripcion, formatoParam(p), p.vigente_desde,
                     [p.gaceta_oficial,p.fundamento].filter(Boolean).join(' · ')]);
  ESTADO.conceptos= con.data || [];
  ESTADO.tasas    = tas.data || [];

  // Salario vigente por empleado
  const salPor = {};
  (sal.data||[]).filter(s=>!s.vigente_hasta).forEach(s=>salPor[s.empleado_id]=s);

  const codPorId = {}; ESTADO.tiendas.forEach(t=>codPorId[t.id]=t.codigo);
  const cargoPorId = {}; ESTADO.cargos.forEach(c=>cargoPorId[c.id]=c.nombre);

  ESTADO.empleados = (emps.data||[]).map(e=>({
    id:e.id, ci:e.cedula, n:e.nombre_completo,
    cargo: cargoPorId[e.cargo_id] || '—',
    cargo_id:e.cargo_id, t: codPorId[e.tienda_id] || '',
    tienda_id:e.tienda_id, ing:e.fecha_ingreso, est:e.estado,
    usuario_id:e.usuario_id, tipo_nomina:e.tipo_nomina,
    sal: salPor[e.id] ? (salPor[e.id].moneda_salario==='USD'
          ? +salPor[e.id].salario_base : +salPor[e.id].salario_base/TASA) : 0,
    moneda: salPor[e.id]?.moneda_salario || 'USD',
    // Beneficios propios: si vienen nulos manda el tabulador del cargo
    complemento_usd: e.complemento_usd,
    cestaticket_usd: e.cestaticket_usd,
    islr: +e.porcentaje_retencion_islr || 0,
  }));

  // Quién se queda sin medición de horas extra por no tener horario
  try{ const {data:sh} = await sb.rpc('sin_horario'); ESTADO.sinHorario = sh || []; }
  catch(e){ ESTADO.sinHorario = []; }

  CARGANDO=false;
  const err=[emp,tie,car,emps,usr].map(r=>r.error).filter(Boolean);
  if(err.length) aviso(explicar(err[0]));
}
function formatoParam(p){
  if(p.unidad==='porcentaje') return (p.valor*100).toFixed(2).replace('.',',')+' %';
  if(p.moneda==='USD') return 'USD '+bs(p.valor);
  if(p.moneda==='VES') return 'Bs. '+bs(p.valor);
  return String(+p.valor).replace('.',',');
}

/* ---------- TIENDAS ---------- */
async function crearTienda(d){
  const r = await conError(()=>sb.from('tiendas').insert({
    empresa_id: ESTADO.empresa.id, codigo:d.codigo.toUpperCase(), nombre:d.nombre,
    estado_pais:d.estado_pais, ciudad:d.ciudad, direccion:d.direccion,
    telefono:d.telefono, activa:true}).select().single(), 'Tienda creada');
  if(r) { ESTADO.tiendas.push(r); ESTADO.tiendas.sort((a,b)=>a.codigo.localeCompare(b.codigo)); }
  return r;
}
async function editarTienda(id,d){
  const r = await conError(()=>sb.from('tiendas').update({
    nombre:d.nombre, estado_pais:d.estado_pais, ciudad:d.ciudad,
    direccion:d.direccion, telefono:d.telefono}).eq('id',id).select().single(), 'Tienda actualizada');
  if(r) Object.assign(ESTADO.tiendas.find(t=>t.id===id), r);
  return r;
}
async function eliminarTienda(id){
  const r = await conError(()=>sb.from('tiendas').delete().eq('id',id).select(), 'Tienda eliminada');
  if(r) ESTADO.tiendas = ESTADO.tiendas.filter(t=>t.id!==id);
  return r;
}
async function cambiarActivaTienda(id,activa){
  const r = await conError(()=>sb.from('tiendas').update({activa}).eq('id',id).select().single());
  if(r){ Object.assign(ESTADO.tiendas.find(t=>t.id===id), r);
         aviso(r.nombre+(activa?' reactivada':' desactivada')); }
  return r;
}

/* ---------- CARGOS ---------- */
async function cargoIdDe(nombre){
  if(!nombre) return null;
  const existe = ESTADO.cargos.find(c=>c.nombre.toLowerCase()===nombre.toLowerCase());
  if(existe) return existe.id;
  const r = await conError(()=>sb.from('cargos').insert({
    empresa_id:ESTADO.empresa.id, nombre, departamento:'Operaciones'}).select().single());
  if(r) ESTADO.cargos.push(r);
  return r ? r.id : null;
}

/* ---------- EMPLEADOS ---------- */
function partirNombre(txt){
  const p = txt.trim().split(/\s+/);
  if(p.length===1) return {pn:p[0], sn:null, pa:'', sa:null};
  if(p.length===2) return {pn:p[0], sn:null, pa:p[1], sa:null};
  if(p.length===3) return {pn:p[0], sn:null, pa:p[1], sa:p[2]};
  return {pn:p[0], sn:p[1], pa:p[2], sa:p.slice(3).join(' ')};
}
async function crearEmpleado(d){
  const {pn,sn,pa,sa} = partirNombre(d.n);
  const cargo_id = await cargoIdDe(d.cargo);
  const emp = await conError(()=>sb.from('empleados').insert({
    empresa_id: ESTADO.empresa.id, tienda_id: tiendaUUID(d.t), cargo_id,
    cedula:d.ci, primer_nombre:pn, segundo_nombre:sn, primer_apellido:pa, segundo_apellido:sa,
    fecha_ingreso:d.ing, estado:d.est||'activo', tipo_nomina:d.tipo_nomina||'quincenal',
  }).select().single(), 'Empleado creado');
  if(!emp) return null;
  if(d.sal>0){
    await conError(()=>sb.from('historial_salarios').insert({
      empleado_id:emp.id, vigente_desde:d.ing, salario_base:d.sal,
      moneda_salario:'USD', motivo:'Carga inicial'}));
  }
  ESTADO.empleados.push({id:emp.id, ci:emp.cedula, n:emp.nombre_completo, cargo:d.cargo,
    cargo_id, t:d.t, tienda_id:emp.tienda_id, ing:emp.fecha_ingreso, est:emp.estado,
    usuario_id:null, sal:d.sal, moneda:'USD', tipo_nomina:emp.tipo_nomina});
  return emp;
}
async function editarEmpleado(id,d){
  const {pn,sn,pa,sa} = partirNombre(d.n);
  const cargo_id = await cargoIdDe(d.cargo);
  const emp = await conError(()=>sb.from('empleados').update({
    tienda_id: tiendaUUID(d.t), cargo_id, cedula:d.ci,
    primer_nombre:pn, segundo_nombre:sn, primer_apellido:pa, segundo_apellido:sa,
    fecha_ingreso:d.ing, estado:d.est}).eq('id',id).select().single(), 'Cambios guardados');
  if(!emp) return null;
  const local = ESTADO.empleados.find(e=>e.id===id);
  // El salario se versiona: nunca se pisa la vigencia anterior
  if(d.sal>0 && Math.abs(d.sal-local.sal)>0.009){
    await conError(()=>sb.from('historial_salarios').insert({
      empleado_id:id, vigente_desde:hoy(), salario_base:d.sal,
      moneda_salario:'USD', motivo:'Ajuste salarial'}));
    local.sal=d.sal;
  }
  Object.assign(local,{ci:emp.cedula, n:emp.nombre_completo, cargo:d.cargo, cargo_id,
    t:d.t, tienda_id:emp.tienda_id, ing:emp.fecha_ingreso, est:emp.estado});
  return emp;
}
async function eliminarEmpleado(id){
  const r = await conError(()=>sb.from('empleados').delete().eq('id',id).select(), 'Empleado eliminado');
  if(r) ESTADO.empleados = ESTADO.empleados.filter(e=>e.id!==id);
  return r;
}
async function crearEmpleadosEnLote(filas){
  let creados=0, fallos=[];
  for(const f of filas){
    const r = await crearEmpleadoSilencioso(f);
    r ? creados++ : fallos.push(f.ci);
  }
  return {creados, fallos};
}
async function crearEmpleadoSilencioso(d){
  try{
    const {pn,sn,pa,sa} = partirNombre(d.n);
    const cargo_id = await cargoIdDe(d.cargo);
    const {data:emp, error} = await sb.from('empleados').insert({
      empresa_id: ESTADO.empresa.id, tienda_id: tiendaUUID(d.t), cargo_id,
      cedula:d.ci, primer_nombre:pn, segundo_nombre:sn, primer_apellido:pa, segundo_apellido:sa,
      fecha_ingreso:d.ing, estado:'activo', tipo_nomina:'quincenal'}).select().single();
    if(error) throw error;
    if(d.sal>0) await sb.from('historial_salarios').insert({
      empleado_id:emp.id, vigente_desde:d.ing, salario_base:d.sal,
      moneda_salario:'USD', motivo:'Carga masiva'});
    ESTADO.empleados.push({id:emp.id, ci:emp.cedula, n:emp.nombre_completo, cargo:d.cargo,
      cargo_id, t:d.t, tienda_id:emp.tienda_id, ing:emp.fecha_ingreso, est:'activo',
      usuario_id:null, sal:d.sal, moneda:'USD'});
    return true;
  }catch(e){ console.error(d.ci, e); return false; }
}

/* ---------- USUARIOS ---------- */
async function cambiarRol(id, rol, tiendaCod){
  const r = await conError(()=>sb.rpc('asignar_rol',
    {p_usuario:id, p_rol:rol, p_tienda_codigo:tiendaCod||null}), 'Rol actualizado');
  if(r){ const u=ESTADO.usuarios.find(x=>x.id===id);
    if(u){ u.rol=rol; u.tienda_codigo=tiendaCod||null; u.tienda=tiendaCod?nomTienda(tiendaCod):null; } }
  return r;
}
async function activarUsuario(id, activo){
  const r = await conError(()=>sb.rpc('activar_usuario',{p_usuario:id, p_activo:activo}));
  if(r!==null){ const u=ESTADO.usuarios.find(x=>x.id===id); if(u) u.activo=activo;
    aviso(activo?'Usuario reactivado':'Usuario desactivado'); }
  return r;
}

/* ---------- EMPRESA ---------- */
async function guardarEmpresa(d){
  const r = await conError(()=>sb.from('empresas').update(d)
    .eq('id',ESTADO.empresa.id).select().single(), 'Datos de la empresa guardados');
  if(r) ESTADO.empresa = r;
  return r;
}

/* ---------- PARÁMETROS LEGALES ---------- */
async function nuevaVigencia(d){
  // No se actualiza el valor anterior: se inserta la vigencia nueva y un
  // trigger de la base cierra la anterior con su fecha.
  const r = await conError(()=>sb.from('parametros_legales').insert({
    clave:d.clave, descripcion:d.descripcion, valor:d.valor,
    moneda:d.moneda||null, unidad:d.unidad, vigente_desde:d.desde,
    gaceta_oficial:d.gaceta||null, fundamento:d.fundamento||null
  }).select().single(), 'Vigencia cargada · la anterior quedó en el histórico');
  if(r) await cargarTodo();
  return r;
}
async function historicoParametro(clave){
  const { data } = await sb.from('parametros_legales').select('*')
    .eq('clave',clave).order('vigente_desde',{ascending:false});
  return data || [];
}

/* ---------- CONCEPTOS DE NÓMINA ---------- */
async function guardarConcepto(id,d){
  const r = await conError(()=>sb.from('conceptos_nomina').update(d)
    .eq('id',id).select().single(), 'Concepto actualizado');
  if(r) Object.assign(ESTADO.conceptos.find(c=>c.id===id), r);
  return r;
}
async function crearConcepto(d){
  const r = await conError(()=>sb.from('conceptos_nomina').insert({
    empresa_id:ESTADO.empresa.id, ...d}).select().single(), 'Concepto creado');
  if(r) ESTADO.conceptos.push(r);
  return r;
}

/* ---------- TASAS BCV ---------- */
async function guardarTasa(fecha, tasa, origen){
  const r = await conError(()=>sb.from('tasas_cambio')
    .upsert({fecha, tasa_usd:tasa, origen}, {onConflict:'fecha'})
    .select().single(), 'Tasa registrada');
  if(r){ ESTADO.tasas = ESTADO.tasas.filter(t=>t.fecha!==fecha);
         ESTADO.tasas.unshift(r);
         ESTADO.tasas.sort((a,b)=>b.fecha.localeCompare(a.fecha)); }
  return r;
}

/* ---------- PRESTACIONES Y LIQUIDACIONES ---------- */
async function pedirSaldo(empleadoId){
  const { data, error } = await sb.rpc('saldo_prestaciones',{p_empleado:empleadoId});
  if(error){ aviso(explicar(error)); return null; }
  return data;
}
async function pedirLiquidacion(empleadoId, fecha, motivo){
  const { data, error } = await sb.rpc('simular_liquidacion',
    {p_empleado:empleadoId, p_fecha_egreso:fecha, p_motivo:motivo});
  if(error){ aviso(explicar(error)); return null; }
  return data;
}
async function pedirPasivo(tiendaCod){
  const { data, error } = await sb.rpc('pasivo_laboral',{p_tienda_codigo:tiendaCod||null});
  if(error) return null;
  return data;
}
/* ---------- TABULADOR POR CARGO ---------- */
async function guardarCargo(id, d){
  const c = await conError(()=>sb.from('cargos').update({
    salario_base_usd: d.salario_base_usd||0,
    complemento_usd:  d.complemento_usd||0,
    cestaticket_usd:  d.cestaticket_usd||0,
  }).eq('id',id).select().single(), 'Tabulador guardado');
  if(c){ const i=ESTADO.cargos.findIndex(x=>x.id===id); if(i>=0) ESTADO.cargos[i]=c; }
  return c;
}
async function aplicarTabuladorRPC(cargoId, desde){
  const n = await conError(()=>sb.rpc('aplicar_tabulador',
    {p_cargo:cargoId, p_desde:desde||hoy()}));
  if(n!==null) { aviso(`${n} trabajador${n===1?'':'es'} con el sueldo del tabulador`); await cargarTodo(); }
  return n;
}
/* Complemento y cestaticket propios de un trabajador */
async function guardarBeneficios(empId, d){
  const e = await conError(()=>sb.from('empleados').update({
    complemento_usd: d.complemento_usd===''?null:+d.complemento_usd,
    cestaticket_usd: d.cestaticket_usd===''?null:+d.cestaticket_usd,
  }).eq('id',empId).select().single(), 'Beneficios guardados');
  if(e){ const l=ESTADO.empleados.find(x=>x.id===empId);
         if(l){ l.complemento_usd=e.complemento_usd; l.cestaticket_usd=e.cestaticket_usd; } }
  return e;
}
/* ---------- FIDEICOMISO Y TRIMESTRALES ---------- */
async function pedirFideicomiso(empleadoId){
  return await conError(()=>sb.rpc('fideicomiso', {p_empleado:empleadoId}));
}
async function pedirTrimestrales(empleadoId){
  return await conError(()=>sb.rpc('prestaciones_trimestrales', {p_empleado:empleadoId}));
}
async function cerrarTrimestreRPC(anio, trim){
  return await conError(()=>sb.rpc('cerrar_trimestre',{p_anio:anio, p_trimestre:trim}));
}
</script>

        ¿Sin cuenta? El gerente general envía las invitaciones desde

        onclick="pantallaConfig()">Cambiar conexión</button>`}</p>
    </div>`;
  document.getElementById('login').style.display='flex';
  document.getElementById('app').classList.remove('on');
}

async function entrar(){
  const email=document.getElementById('li_email').value.trim();
  const pass=document.getElementById('li_pass').value;
  if(!email||!pass) return aviso('Escribe tu correo y tu contraseña');
  const b=document.getElementById('btnentrar');
  b.disabled=true; b.textContent='Entrando…';
  const { data, error } = await sb.auth.signInWithPassword({email, password:pass});
  b.disabled=false; b.textContent='Iniciar sesión';
  if(error) return aviso(explicar(error));
  await abrirSesion(data.user);
}

async function abrirSesion(user){
  const { data:perfil, error } = await sb.from('perfiles')
    .select('id,nombre,email,rol,activo,tienda_id').eq('id',user.id).maybeSingle();
  if(error) return aviso(explicar(error));
  if(!perfil){
    await sb.auth.signOut();
    return pantallaLogin('Tu cuenta existe pero no tiene perfil en el sistema. '+
      'Pídele al gerente general que ejecute la migración de usuarios o que te cree el perfil.');
  }
  if(!perfil.activo){
    await sb.auth.signOut();
    return pantallaLogin('Tu cuenta está desactivada. Contacta al gerente general.');
  }
  SESION = {...perfil};
  document.getElementById('login').style.display='none';
  document.getElementById('app').classList.add('on');
  VISTA='panel'; FILTRO={tienda:'',texto:'',estado:''};
  await cargarTodo();
  SESION.tienda_codigo = (ESTADO.tiendas.find(t=>t.id===perfil.tienda_id)||{}).codigo || null;
  pintar();
}

async function salir(){
  cerrarModal();
  await sb.auth.signOut();
  SESION=null; ESTADO.empleados=[]; ESTADO.tiendas=[];
  pantallaLogin();
}
async function recuperar(){
  const email=document.getElementById('li_email').value.trim();
  if(!email) return aviso('Escribe primero tu correo');
  const { error } = await sb.auth.resetPasswordForEmail(email,
    {redirectTo: location.origin + location.pathname});
  aviso(error ? explicar(error) : 'Te enviamos un enlace para restablecer la contraseña');
}

async function arrancar(){
  if(!CFG.key || !conectar()) return pantallaConfig();
  const { data:{ session } } = await sb.auth.getSession();
  if(session) await abrirSesion(session.user);
  else pantallaLogin();
}
window.addEventListener('DOMContentLoaded', ()=>{
  if(!window.supabase) return pantallaConfig(
    'No se pudo cargar la librería de Supabase. Revisa tu conexión a internet y recarga.');
  arrancar();
});
</script>
<script>
/* =====================================================================
   ESCRITOR DE .XLSX
   Un .xlsx es un ZIP con unos cuantos XML adentro. Se arma a mano, con
   las entradas guardadas sin comprimir (método 0), que es lo único que
   hace falta para que Excel lo abra. Así no dependemos de ninguna
   librería externa ni de que el navegador tenga CompressionStream.
   ===================================================================== */
const _crcTabla = (()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n;
    for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1;
    t[n]=c>>>0; }
  return t; })();
function _crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) c = _crcTabla[(c^bytes[i])&0xFF] ^ (c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function _zip(archivos){
  const enc=new TextEncoder(); const partes=[]; const dir=[];
  let off=0;
  const u16=n=>[n&255,(n>>8)&255];
  const u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  archivos.forEach(f=>{
    const nombre=enc.encode(f.nombre);
    const datos =enc.encode(f.datos);
    const crc=_crc32(datos);
    const cab=[...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
               ...u32(crc),...u32(datos.length),...u32(datos.length),
               ...u16(nombre.length),...u16(0)];
    partes.push(new Uint8Array(cab), nombre, datos);
    dir.push({nombre, crc, tam:datos.length, off});
    off += cab.length + nombre.length + datos.length;
  });
  const central=[];
  dir.forEach(d=>{
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),
      ...u16(0),...u16(0),...u32(d.crc),...u32(d.tam),...u32(d.tam),
      ...u16(d.nombre.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(d.off)]));
    central.push(d.nombre);
  });
  const tamCentral=central.reduce((a,x)=>a+x.length,0);
  central.push(new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),
    ...u16(dir.length),...u16(dir.length),...u32(tamCentral),...u32(off),...u16(0)]));
  const todo=[...partes,...central];
  const total=todo.reduce((a,x)=>a+x.length,0);
  const salida=new Uint8Array(total); let p=0;
  todo.forEach(x=>{ salida.set(x,p); p+=x.length; });
  return new Blob([salida], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const _xesc = s => String(s??'').replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
function _col(n){ let s=''; n++; while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=(n-1-r)/26; } return s; }

/* filas: matriz. La primera fila se toma como encabezado. */
function bajarExcel(nombreArchivo, hoja, filas){
  if(!filas || !filas.length) return aviso('No hay nada que exportar');
  const xmlFilas = filas.map((fila,i)=>
    `<row r="${i+1}">${fila.map((v,j)=>{
      const ref=_col(j)+(i+1);
      if(i>0 && typeof v==='number' && isFinite(v))
        return `<c r="${ref}"><v>${v}</v></c>`;
      return `<c r="${ref}" t="inlineStr"${i===0?' s="1"':''}><is><t xml:space="preserve">${_xesc(v)}</t></is></c>`;
    }).join('')}</row>`).join('');

  const archivos=[
   {nombre:'[Content_Types].xml', datos:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>

<script>
/* =====================================================================
   IMPORTACIÓN DE EXCEL
   Tres caminos: .xlsx real (ZIP + XML), .csv, o pegar desde Excel (TSV).
   El .xlsx se descomprime con DecompressionStream, sin librerías externas.
   ===================================================================== */

/* --- ZIP mínimo: localiza y descomprime una entrada por nombre --- */
async function zipEntradas(buf){
  const dv=new DataView(buf), U=new Uint8Array(buf), out={};
  // El directorio central va al final; se busca su firma hacia atrás
  let eocd=-1;
  for(let i=U.length-22;i>=0 && i>U.length-66000;i--)
    if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}
  if(eocd<0) throw new Error('El archivo no parece un .xlsx válido');
  const nEnt=dv.getUint16(eocd+10,true);
  let p=dv.getUint32(eocd+16,true);
  for(let i=0;i<nEnt;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const metodo=dv.getUint16(p+10,true), comp=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);
    const off=dv.getUint32(p+42,true);
    const nombre=new TextDecoder().decode(U.subarray(p+46,p+46+nl));
    // Cabecera local: el tamaño de "extra" puede diferir del central
    const lnl=dv.getUint16(off+26,true), lel=dv.getUint16(off+28,true);
    const ini=off+30+lnl+lel;
    out[nombre]={metodo,datos:U.subarray(ini,ini+comp)};
    p+=46+nl+el+cl;
  }
  return out;
}
async function inflar(entrada){
  if(!entrada) return '';
  if(entrada.metodo===0) return new TextDecoder().decode(entrada.datos);
  if(typeof DecompressionStream==='undefined')
    throw new Error('Este navegador no puede descomprimir .xlsx. Guarda el archivo como CSV y vuelve a intentarlo.');
  const ds=new DecompressionStream('deflate-raw');
  const s=new Blob([entrada.datos]).stream().pipeThrough(ds);
  return await new Response(s).text();
}
function colAIndice(ref){           // "AB12" -> 27
  let n=0; for(const c of ref.replace(/\d+/g,'')) n=n*26+(c.charCodeAt(0)-64);
  return n-1;
}
async function leerXLSX(buf){
  const z=await zipEntradas(buf);
  const dp=new DOMParser();
  let shared=[];
  const ssKey=Object.keys(z).find(n=>/sharedStrings\.xml$/i.test(n));
  if(ssKey){
    const d=dp.parseFromString(await inflar(z[ssKey]),'application/xml');
    shared=[...d.getElementsByTagName('si')].map(si=>
      [...si.getElementsByTagName('t')].map(t=>t.textContent).join(''));
  }
  const shKey=Object.keys(z).find(n=>/xl\/worksheets\/sheet1\.xml$/i.test(n))
           || Object.keys(z).find(n=>/xl\/worksheets\/.*\.xml$/i.test(n));
  if(!shKey) throw new Error('No se encontró ninguna hoja dentro del archivo');
  const d=dp.parseFromString(await inflar(z[shKey]),'application/xml');
  const filas=[];
  for(const row of d.getElementsByTagName('row')){
    const f=[];
    for(const c of row.getElementsByTagName('c')){
      const idx=colAIndice(c.getAttribute('r')||'A1');
      const v=c.getElementsByTagName('v')[0];
      let val='';
      if(c.getAttribute('t')==='s') val = shared[+(v?v.textContent:0)] ?? '';
      else if(c.getAttribute('t')==='inlineStr')
        val=[...c.getElementsByTagName('t')].map(t=>t.textContent).join('');
      else val = v ? v.textContent : '';
      f[idx]=val;
    }
    filas.push([...f].map(x=>x??''));
  }
  return filas;
}
function partirCSV(txt){
  const sep = txt.includes('\t') ? '\t' : (txt.split('\n')[0].split(';').length > txt.split('\n')[0].split(',').length ? ';' : ',');
  return txt.replace(/\r/g,'').split('\n').filter(l=>l.trim()).map(linea=>{
    const out=[]; let cur='', dentro=false;
    for(let i=0;i<linea.length;i++){
      const ch=linea[i];
      if(ch==='"'){ if(dentro && linea[i+1]==='"'){cur+='"';i++;} else dentro=!dentro; }
      else if(ch===sep && !dentro){ out.push(cur); cur=''; }
      else cur+=ch;
    }
    out.push(cur); return out.map(s=>s.trim());
  });
}

/* =====================================================================
   MAPEO DE COLUMNAS — dos tipos de carga: empleados y asistencia
   ===================================================================== */
const ESQUEMAS = {
 empleados:{
  et:'Empleados',
  campos:[
   {k:'ci',    et:'Cédula',        oblig:true,  claves:['cedula','cédula','ci','documento','c.i.','identificacion','identificación']},
   {k:'n',     et:'Nombre',        oblig:true,  claves:['nombre','nombres','empleado','trabajador','apellidos y nombres','nombre completo']},
   {k:'cargo', et:'Cargo',         oblig:false, claves:['cargo','puesto','posicion','posición','funcion','función']},
   {k:'t',     et:'Tienda',        oblig:false, claves:['tienda','sucursal','local','codigo tienda','código tienda','sede']},
   {k:'ing',   et:'Fecha ingreso', oblig:false, claves:['ingreso','fecha ingreso','fecha de ingreso','f. ingreso','fecha_ingreso','fecha de entrada']},
   {k:'sal',   et:'Salario USD',   oblig:false, claves:['salario','sueldo','salario usd','sueldo usd','monto','remuneracion','remuneración']},
  ]},
 asistencia:{
  et:'Marcajes de asistencia',
  campos:[
   {k:'ci',     et:'Cédula',            oblig:true,  claves:['cedula','cédula','ci','documento','c.i.']},
   {k:'fecha',  et:'Fecha',             oblig:true,  claves:['fecha','dia','día','fecha marcaje','jornada']},
   {k:'ent',    et:'Entrada',           oblig:false, claves:['entrada','hora entrada','llegada','ingreso','entrada trabajo','hora de entrada']},
   {k:'salAlm', et:'Salida a almuerzo', oblig:false, claves:['salida almuerzo','salida a almuerzo','inicio almuerzo','salida comida','almuerzo salida']},
   {k:'regAlm', et:'Regreso de almuerzo',oblig:false,claves:['regreso almuerzo','regreso de almuerzo','fin almuerzo','regreso comida','almuerzo regreso','entrada almuerzo']},
   {k:'sal',    et:'Salida',            oblig:false, claves:['salida','hora salida','salida trabajo','egreso','hora de salida']},
  ]},
};
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
function detectarMapa(cab,campos){
  const m={};
  campos.forEach(c=>{
    const i=cab.findIndex(h=>c.claves.includes(norm(h)));
    if(i>=0) m[c.k]=i;
  });
  return m;
}
function fechaExcel(v){
  if(v===''||v==null) return '';
  if(/^\d{5}(\.\d+)?$/.test(String(v))){
    const d=new Date(Date.UTC(1899,11,30)+Math.floor(+v)*864e5);
    return d.toISOString().slice(0,10);
  }
  const m=String(v).match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){ const a=m[3].length===2?'20'+m[3]:m[3];
    return `${a}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  const m2=String(v).match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m2) return `${m2[1]}-${m2[2].padStart(2,'0')}-${m2[3].padStart(2,'0')}`;
  return String(v).slice(0,10);
}
function horaExcel(v){
  if(v===''||v==null) return '';
  const s=String(v).trim();
  if(/^0?\.\d+$/.test(s)){                       // fracción de día que usa Excel
    const min=Math.round(parseFloat(s)*1440);
    return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0');
  }
  const m=s.match(/^(\d{1,2})[:.h](\d{2})/i);
  if(m){
    let h=+m[1]; const pm=/p\.?m\.?/i.test(s), am=/a\.?m\.?/i.test(s);
    if(pm && h<12) h+=12; if(am && h===12) h=0;
    return String(h).padStart(2,'0')+':'+m[2];
  }
  if(/^\d{3,4}$/.test(s)) return s.padStart(4,'0').replace(/(\d{2})(\d{2})/,'$1:$2');
  return '';
}
const aMin = h => { const m=/^(\d{2}):(\d{2})$/.exec(h||''); return m ? +m[1]*60+ +m[2] : null; };
const aHora = m => m==null?'—':String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');

let IMPORT={tipo:'empleados',filas:[],validas:[],errores:[],faltan:[]};

function analizarImportacion(filas){
  const esq=ESQUEMAS[IMPORT.tipo];
  if(!filas || filas.length<2){ aviso('El archivo no tiene filas de datos'); return; }
  const cab=filas[0], mapa=detectarMapa(cab,esq.campos);
  IMPORT.faltan = esq.campos.filter(c=>c.oblig && !(c.k in mapa));
  IMPORT.validas=[]; IMPORT.errores=[];
  const g=(f,c)=>String(f[mapa[c]]??'').trim();

  if(IMPORT.tipo==='empleados'){
    // Se reconoce la tienda por su CÓDIGO (T001) o por su NOMBRE, sin
    // importar mayúsculas ni acentos. Si no se reconoce, la fila NO se
    // rechaza: entra con la tienda vacía y se corrige con el selector.
    const porCodigo={}, porNombre={};
    ESTADO.tiendas.forEach(t=>{ porCodigo[norm(t.codigo)]=t.codigo;
                                porNombre[norm(t.nombre)]=t.codigo; });
    const yaHay=new Set(ESTADO.empleados.map(e=>e.ci));
    const porDefecto = FILTRO.tienda || tiendaFija() || '';
    filas.slice(1).forEach((f,i)=>{
      const ci=g(f,'ci').replace(/[.\s-]/g,'').replace(/^[VE]/i,'');
      const crudo=g(f,'t').trim();
      let t = crudo ? (porCodigo[norm(crudo)] || porNombre[norm(crudo)] || '') : porDefecto;
      const fila={ci, n:g(f,'n'), cargo:g(f,'cargo')||'Vendedor', t,
                  tCrudo: crudo,
                  ing:fechaExcel(g(f,'ing'))||hoy(),
                  sal:parseFloat(String(g(f,'sal')).replace(/[^\d.,]/g,'').replace(',','.'))||0};
      const err=[];
      if(!/^\d{6,9}$/.test(ci)) err.push('cédula inválida');
      if(!fila.n) err.push('falta el nombre');
      if(yaHay.has(ci)) err.push('cédula ya registrada');
      if(err.length) IMPORT.errores.push({fila:i+2, datos:fila, err});
      else { IMPORT.validas.push(fila); yaHay.add(ci); }
    });
  } else {
    const porCI={}; ESTADO.empleados.forEach(e=>porCI[e.ci]=e);
    const alcance = FILTRO.tienda || tiendaFija() || '';
    filas.slice(1).forEach((f,i)=>{
      const ci=g(f,'ci').replace(/[.\s-]/g,'').replace(/^[VE]/i,'');
      const emp=porCI[ci];
      const fila={ci, nombre:emp?emp.n:'—', tienda:emp?emp.t:'—',
        fecha:fechaExcel(g(f,'fecha')), ent:horaExcel(g(f,'ent')),
        salAlm:horaExcel(g(f,'salAlm')), regAlm:horaExcel(g(f,'regAlm')), sal:horaExcel(g(f,'sal'))};
      const err=[];
      if(!emp) err.push('no hay ningún empleado con la cédula '+(ci||'vacía'));
      else if(alcance && emp.t!==alcance) err.push('pertenece a '+emp.t+', fuera de la tienda seleccionada');
      if(!/^\d{4}-\d{2}-\d{2}$/.test(fila.fecha)) err.push('fecha inválida');
      if(!fila.ent && !fila.sal) err.push('sin hora de entrada ni de salida');
      const e1=aMin(fila.ent), s1=aMin(fila.sal);
      if(e1!=null && s1!=null && s1<=e1) err.push('la salida no puede ser anterior a la entrada');
      // Horas trabajadas descontando el almuerzo
      const a1=aMin(fila.salAlm), a2=aMin(fila.regAlm);
      const alm = (a1!=null && a2!=null && a2>a1) ? a2-a1 : 0;
      fila.almuerzo=alm;
      fila.horas = (e1!=null && s1!=null) ? +(((s1-e1-alm)/60).toFixed(2)) : 0;
      fila.retardo = e1!=null ? Math.max(0, e1-(9*60+10)) : 0;   // 09:00 + 10 min de tolerancia
      if(err.length) IMPORT.errores.push({fila:i+2, datos:fila, err});
      else IMPORT.validas.push(fila);
    });
  }
  pintarPrevia();
}

function pintarPrevia(){
  const {validas,errores,faltan,tipo}=IMPORT;
  const cuerpo=document.getElementById('impcuerpo');
  if(!cuerpo) return;
  if(faltan.length){
    cuerpo.innerHTML=`<div class="note cr"><span class="ni">▲</span><div>
      No se reconocieron las columnas obligatorias: <b>${faltan.map(f=>f.et).join(', ')}</b>.
      Revisa que la primera fila del archivo tenga los encabezados.</div></div>`;
    botonImport(0); return;
  }
  const sinTienda = tipo==='empleados' ? validas.filter(v=>!v.t).length : 0;
  const enc = tipo==='empleados'
    ? ['Cédula','Nombre','Cargo','Tienda','Ingreso','USD','Estado']
    : ['Cédula','Empleado','Fecha','Entrada','Almuerzo','Salida','Horas','Estado'];
  const opcT = sel => ESTADO.tiendas.map(t=>
      `<option value="${esc(t.codigo)}" ${t.codigo===sel?'selected':''}>${esc(t.codigo)} · ${esc(t.nombre)}</option>`).join('');
  const fila = (v,i) => tipo==='empleados'
    ? `<td class="mono">${esc(v.ci)}</td>
       <td><input class="celda" value="${esc(v.n)}" onchange="editarFilaImp(${i},'n',this.value)"></td>
       <td><input class="celda" value="${esc(v.cargo)}" onchange="editarFilaImp(${i},'cargo',this.value)"></td>
       <td><select class="celda ${v.t?'':'vacia'}" onchange="editarFilaImp(${i},'t',this.value)">
             <option value="">— elegir tienda —</option>${opcT(v.t)}</select>
           ${!v.t&&v.tCrudo?`<div class="mini" style="color:var(--warn)">no reconocí "${esc(v.tCrudo)}"</div>`:''}</td>
       <td><input class="celda" type="date" value="${esc(v.ing)}" onchange="editarFilaImp(${i},'ing',this.value)"></td>
       <td class="num"><input class="celda num" type="number" step="0.01" value="${v.sal}"
             onchange="editarFilaImp(${i},'sal',this.value)"></td>
       <td>${v.t?'<span class="pill ok">Listo</span>':'<span class="pill wa">Falta tienda</span>'}</td>`
    : `<td class="mono">${esc(v.ci)}</td><td><b>${esc(v.nombre)}</b>
         <div class="mini">${esc(v.tienda)}</div></td>
       <td class="mono">${fechaCorta(v.fecha)}</td><td class="mono">${esc(v.ent||'—')}</td>
       <td class="mono">${v.almuerzo?v.almuerzo+' min':'—'}</td><td class="mono">${esc(v.sal||'—')}</td>
       <td class="num">${v.horas.toFixed(2).replace('.',',')}</td>
       <td>${v.retardo>0?`<span class="pill wa">Retardo ${v.retardo}′</span>`:'<span class="pill ok">Listo</span>'}</td>`;

  cuerpo.innerHTML=`
   <div class="stepnums">
     <span>Listos para cargar <b style="color:var(--good)">${validas.length}</b></span>
     <span>Con problemas <b style="color:${errores.length?'var(--crit)':'var(--ink-3)'}">${errores.length}</b></span>
     <span>Total leído <b>${validas.length+errores.length}</b></span>
     ${tipo==='asistencia'&&validas.length?`<span>Retardos detectados
       <b style="color:var(--warn)">${validas.filter(v=>v.retardo>0).length}</b></span>`:''}
   </div>
   ${tipo==='empleados'?`<div class="impbar">
     <span>Asignar <b>todas</b> las filas a:</span>
     <select id="impmasiva" class="celda" style="min-width:200px">
       <option value="">— elegir tienda —</option>
       ${ESTADO.tiendas.map(t=>`<option value="${esc(t.codigo)}">${esc(t.codigo)} · ${esc(t.nombre)}</option>`).join('')}
     </select>
     <button class="btn ghost sm" style="width:auto" onclick="asignarTiendaATodas()">Aplicar a todas</button>
     ${sinTienda?`<span class="pill wa">${sinTienda} sin tienda</span>`:'<span class="pill ok">Todas con tienda</span>'}
   </div>`:''}
   <div class="previewtbl"><table>
     <thead><tr>${enc.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
     <tbody>
     ${validas.slice(0,60).map((v,i)=>`<tr>${fila(v,i)}</tr>`).join('')}
     ${errores.slice(0,40).map(e=>`<tr class="bad">
       <td class="mono">${esc(e.datos.ci||'—')}</td>
       <td colspan="${enc.length-2}" style="font-size:12.5px;color:var(--crit)">
         Fila ${e.fila}: ${esc(e.err.join(' · '))}</td>
       <td><span class="pill cr">Omitir</span></td></tr>`).join('')}
     </tbody></table></div>
   ${validas.length+errores.length>100?'<p class="hintx">Se muestran las primeras 100 filas; se cargarán todas las válidas.</p>':''}`;
  botonImport(validas.length);
}
/* Corrige una celda de la vista previa sin volver a leer el archivo. */
function editarFilaImp(i, campo, valor){
  const v = IMPORT.validas[i]; if(!v) return;
  v[campo] = campo==='sal' ? (parseFloat(valor)||0) : String(valor).trim();
  if(campo==='t') v.tCrudo='';
  pintarPrevia();
}
/* Pone la misma tienda en todas las filas de la vista previa. */
function asignarTiendaATodas(){
  const sel=document.getElementById('impmasiva');
  if(!sel || !sel.value) return aviso('Elige primero una tienda');
  IMPORT.validas.forEach(v=>{ v.t=sel.value; v.tCrudo=''; });
  pintarPrevia();
  aviso(`${IMPORT.validas.length} filas asignadas a ${nomTienda(sel.value)}`);
}
function botonImport(n){
  const b=document.getElementById('btnimport'); if(!b) return;
  const faltan = IMPORT.tipo==='empleados' ? IMPORT.validas.filter(v=>!v.t).length : 0;
  const listo = n>0 && !faltan;
  b.disabled=!listo; b.style.opacity=listo?1:.45;
  b.textContent = faltan ? `Faltan ${faltan} tienda${faltan===1?'':'s'} por asignar`
    : n ? (IMPORT.tipo==='empleados'
      ? `Cargar ${n} empleado${n===1?'':'s'}`
      : `Cargar ${n} marcaje${n===1?'':'s'}`)
    : 'Nada que cargar';
}

async function archivoImport(file){
  if(!file) return;
  try{
    let filas;
    if(/\.xlsx$/i.test(file.name)) filas=await leerXLSX(await file.arrayBuffer());
    else if(/\.(csv|tsv|txt)$/i.test(file.name)) filas=partirCSV(await file.text());
    else if(/\.xls$/i.test(file.name))
      throw new Error('El formato .xls antiguo no se puede leer. Guárdalo como .xlsx o .csv.');
    else throw new Error('Formato no reconocido. Usa .xlsx, .csv o .txt.');
    analizarImportacion(filas);
    aviso('Archivo leído: '+file.name);
  }catch(e){ aviso(e.message); }
}
function pegarImport(txt){
  if(!txt.trim()){ aviso('No pegaste nada'); return; }
  analizarImportacion(partirCSV(txt));
}
async function confirmarImport(){
  if(!IMPORT.validas.length) return;
  if(IMPORT.tipo==='empleados'){
    const faltan = IMPORT.validas.filter(v=>!v.t).length;
    if(faltan) return aviso(`Faltan ${faltan} filas por asignarle tienda`);
    const b=document.getElementById('btnimport');
    if(b){ b.disabled=true; b.textContent='Guardando en la base…'; }
    // Se escriben de verdad en Supabase, uno por uno, para poder decir
    // exactamente cuáles fallaron y por qué.
    const {creados, fallos} = await crearEmpleadosEnLote(IMPORT.validas);
    if(fallos.length){
      aviso(`${creados} cargados · ${fallos.length} fallaron (cédulas: ${fallos.slice(0,5).join(', ')}${fallos.length>5?'…':''})`);
    } else {
      aviso(`${creados} empleado${creados===1?'':'s'} guardado${creados===1?'':'s'} en la base de datos`);
    }
  } else {
    IMPORT.validas.forEach(v=>{
      ESTADO.marcajes = ESTADO.marcajes.filter(m=>!(m.ci===v.ci && m.fecha===v.fecha));
      ESTADO.marcajes.push(v);
      // El día en curso se refleja de una vez en la asistencia del panel
      if(v.fecha==='2026-08-27'){
        const e=ESTADO.empleados.find(x=>x.ci===v.ci);
        if(e) ESTADO.asistencia[e.id]={ent:v.ent||'—', sal:v.sal||'—',
          est:v.retardo>0?'retardo':(v.ent?'presente':'ausente'), ret:v.retardo};
      }
    });
    auditar('Importó marcajes',`${IMPORT.validas.length} registros de asistencia`);
    aviso(`${IMPORT.validas.length} marcajes cargados`);
  }
  IMPORT={tipo:IMPORT.tipo,filas:[],validas:[],errores:[],faltan:[]};
  cerrarModal(); pintar();
}
</script>

async function guardarEmpleado(id){
  const v = k => document.getElementById('f_'+k).value.trim();
  const ci = v('ci').replace(/[.\s-]/g,'').replace(/^[VE]/i,'');
  if(!/^\d{6,9}$/.test(ci)) return aviso('La cédula debe tener entre 6 y 9 dígitos');
  if(!v('n')) return aviso('Falta el nombre');
  if(!v('t')) return aviso('Selecciona una tienda');
  const b=document.getElementById('btnguardar'); b.disabled=true; b.textContent='Guardando…';
  const datos={ci, n:v('n'), cargo:v('cargo')||'Vendedor', t:v('t'), ing:v('ing'),
               sal:parseFloat(v('sal'))||0, est:v('est')};
  const r = id ? await editarEmpleado(id,datos) : await crearEmpleado(datos);
  b.disabled=false; b.textContent=id?'Guardar cambios':'Crear empleado';
  if(r){ cerrarModal(); pintar(); }
}
function borrarEmpleado(id){
  const e=ESTADO.empleados.find(x=>x.id===id);

function tiendaSegunRolNuevo(){
  const rol=document.getElementById('i_rol'), sel=document.getElementById('i_t'),
        h=document.getElementById('i_hint');
  if(!rol||!sel) return;
  const global = rol.value==='gerente_general';
  sel.disabled=global; sel.style.opacity=global?.5:1;
  if(global) sel.value='';
  if(h) h.textContent = global ? 'El gerente general ve todas las tiendas.'
                               : 'Solo verá los datos de esta tienda.';
}
async function crearUsuario(){
  const g=k=>{const el=document.getElementById('i_'+k); return el?el.value.trim():''};
  if(!g('n')) return aviso('Falta el nombre');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(g('email'))) return aviso('El correo no es válido');
  if(g('pass').length<6) return aviso('La contraseña temporal necesita al menos 6 caracteres');
  const rol=g('rol');
  if(rol!=='gerente_general' && !g('t')) return aviso('Asigna una tienda a este usuario');

  const b=document.getElementById('btncrearu'); b.disabled=true; b.textContent='Creando…';
  try{
    // Cliente aparte y sin guardar sesión: así crear a otro no cierra la tuya
    const cli = window.supabase.createClient(CFG.url, CFG.key,
      {auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false}});
    const meta = {nombre:g('n'), rol};
    if(rol!=='gerente_general') meta.tienda = g('t');
    if(g('ci')) meta.cedula = g('ci');

    const { data, error } = await cli.auth.signUp({
      email:g('email'), password:g('pass'), options:{ data: meta }});
    if(error) throw error;

    // Supabase no delata correos existentes con un error: devuelve el usuario
    // sin identidades. Ese es el indicio de que la cuenta ya estaba creada.
    if(data.user && Array.isArray(data.user.identities) && data.user.identities.length===0){
      b.disabled=false; b.textContent='Crear usuario';
      return aviso('Ese correo ya tiene una cuenta en el sistema');
    }

    cerrarModal();
    aviso(`Usuario creado · entrega la clave ${g('pass')} a ${g('n')}`);
    await cargarTodo();
    if(!ESTADO.usuarios.some(u=>u.email===g('email').toLowerCase())){

/* ---------- RECIBOS: selección e impresión ---------- */
let SEL_RECIBOS=new Set();
function alternarRecibo(ci){
  SEL_RECIBOS.has(ci) ? SEL_RECIBOS.delete(ci) : SEL_RECIBOS.add(ci);
  pintar();
}
function seleccionarTodos(cis){
  const todos = cis.every(c=>SEL_RECIBOS.has(c));
  todos ? cis.forEach(c=>SEL_RECIBOS.delete(c)) : cis.forEach(c=>SEL_RECIBOS.add(c));
  pintar();

/* =====================================================================
   LOS TRES RECIBOS
   El sueldo, el complemento alimentario y el cestaticket se emiten por
   separado. No es un capricho de formato: el cestaticket y el
   complemento son bonificaciones sin incidencia salarial (art. 105
   LOTTT) y meterlos en la misma hoja que el sueldo invita a que un
   inspector los lea como parte de la remuneración.

   Cada renglón lleva su fórmula escrita al lado, para que cualquiera
   pueda rehacer la cuenta a mano.
   ===================================================================== */
const RECIBO_TIPOS = {
  sueldo:      {et:'Recibo de pago',          sub:'Sueldo y horas extra',
                nota:'Los montos de esta hoja son salario: generan prestaciones, vacaciones y utilidades.'},
  complemento: {et:'Complemento alimentario', sub:'Bonificación no salarial',
                nota:'Bonificación sin incidencia salarial · art. 105 LOTTT. No genera prestaciones.'},
  cestaticket: {et:'Cestaticket socialista',  sub:'Beneficio de alimentación',
                nota:'Beneficio de alimentación · Ley del Cestaticket Socialista. No es salario.'},
};

/* Horas extra del periodo, leídas de los marcajes cargados. */
function extrasDe(e, desde, hasta){
  const jor  = parLegal('JORNADA_HORAS_DIA', 8);
  const tol  = parLegal('TOLERANCIA_SALIDA_MIN', 15);
  const ini  = parLegal('JORNADA_NOCTURNA_INICIO', 19);
  const fin  = parLegal('JORNADA_NOCTURNA_FIN', 5);
  let diu=0, noc=0, dias=0, retardos=0;
  (ESTADO.marcajes||[]).filter(m=>m.ci===e.ci &&
      (!desde || m.fecha>=desde) && (!hasta || m.fecha<=hasta)).forEach(m=>{
    dias++;
    if(m.retardo>0) retardos++;
    const salida = aMin(m.sal), prevista = aMin(m.salPrevista||'') ;
    const base = prevista!=null ? prevista : (aMin(m.ent)!=null ? aMin(m.ent)+jor*60+(m.almuerzo||0) : null);
    if(salida==null || base==null) return;
    const exceso = Math.max(0, salida - base - tol);
    if(!exceso) return;
    let n=0;
    for(let i=0;i<exceso;i++){
      const h = Math.floor(((base+tol+i)/60))%24;
      if(h>=ini || h<fin) n++;
    }
    noc += n/60; diu += (exceso-n)/60;
  });
  return {diurnas:+diu.toFixed(2), nocturnas:+noc.toFixed(2), dias, retardos, jornada:jor};
}

/* Arma uno de los tres recibos de un trabajador. */
function calcularRecibo(e, tipo, per){
  per = per || periodoActual();
  const T   = TASA;
  const mes = (e.sal||0) * T;                 // sueldo mensual en bolívares
  const dia = mes/30;
  const hora= dia / parLegal('JORNADA_HORAS_DIA', 8);
  const dias= per.dias;
  const asig=[], ded=[];

  if(tipo==='sueldo'){
    asig.push({et:`Salario base · ${dias} días`,
               f:`USD ${bs(e.sal)} × ${bs4(T)} ÷ 30 × ${dias}`,
               m: dia*dias, salarial:true});

    const x = extrasDe(e, per.desde, per.hasta);
    if(x.diurnas>0){
      const rec = parLegal('RECARGO_HE_DIURNA', 0.5);
      asig.push({et:`Horas extra diurnas · ${bs(x.diurnas)} h`,
                 f:`${bs(x.diurnas)} h × Bs. ${bs(hora)} × ${num(1+rec)} · recargo del ${pct(rec,0)} % (art. 118 LOTTT)`,
                 m: x.diurnas*hora*(1+rec), salarial:true});
    }
    if(x.nocturnas>0){
      const rec = parLegal('RECARGO_HE_DIURNA', 0.5);
      const noc = parLegal('RECARGO_NOCTURNO', 0.3);
      asig.push({et:`Horas extra nocturnas · ${bs(x.nocturnas)} h`,
                 f:`${bs(x.nocturnas)} h × Bs. ${bs(hora)} × ${num(1+rec)} × ${num(1+noc)} · hora extra (art. 118) más bono nocturno del ${pct(noc,0)} % (art. 117)`,
                 m: x.nocturnas*hora*(1+rec)*(1+noc), salarial:true});
    }

    const tA = asig.reduce((a,x)=>a+x.m,0);
    // Deducciones legales del trabajador, todas sobre salario
    const ivss = parLegal('IVSS_TRABAJADOR', 0.04);
    const rpe  = parLegal('RPE_TRABAJADOR', 0.005);
    const faov = parLegal('FAOV_TRABAJADOR', 0.01);
    ded.push({et:`IVSS · ${pct(ivss)} %`,
              f:`Bs. ${bs(tA)} × ${pct(ivss)} % · Ley del Seguro Social`, m:tA*ivss});
    ded.push({et:`Paro forzoso (RPE) · ${pct(rpe)} %`,
              f:`Bs. ${bs(tA)} × ${pct(rpe)} % · Régimen Prestacional de Empleo`, m:tA*rpe});
    ded.push({et:`FAOV · ${pct(faov)} %`,
              f:`Bs. ${bs(tA)} × ${pct(faov)} % · Ley del Régimen Prestacional de Vivienda`, m:tA*faov});
    if(e.islr>0) ded.push({et:`Retención de ISLR · ${num(e.islr)} %`,
              f:`Bs. ${bs(tA)} × ${num(e.islr)} % · porcentaje declarado por el trabajador (AR-I)`,
              m:tA*e.islr/100});
  }

  if(tipo==='complemento'){
    const c = complementoDe(e);
    asig.push({et:'Complemento alimentario',
               f:`USD ${bs(c)} × ${bs4(T)} · bonificación no salarial (art. 105 LOTTT)`,
               m: c*T, salarial:false});
  }

  if(tipo==='cestaticket'){
    const c = cestaticketDe(e);
    asig.push({et:'Cestaticket socialista',
               f:`USD ${bs(c)} × ${bs4(T)} · Ley del Cestaticket Socialista`,
               m: c*T, salarial:false});
  }

  const tA = asig.reduce((a,x)=>a+x.m,0);
  const tD = ded.reduce((a,x)=>a+x.m,0);
  const salarial = asig.filter(x=>x.salarial).reduce((a,x)=>a+x.m,0);
  return {e, tipo, per, asig, ded, tA, tD, neto:tA-tD, salarial, noSal:tA-salarial};
}

/* Cascada empleado → cargo → parámetro general, igual que en la base. */
function complementoDe(e){
  if(e.complemento_usd!=null) return +e.complemento_usd;
  const c = ESTADO.cargos.find(x=>x.id===e.cargo_id);
  return c ? +(c.complemento_usd||0) : 0;
}
function cestaticketDe(e){
  if(e.cestaticket_usd!=null) return +e.cestaticket_usd;
  const c = ESTADO.cargos.find(x=>x.id===e.cargo_id);
  if(c && +c.cestaticket_usd>0) return +c.cestaticket_usd;
  return parLegal('CESTATICKET', 0);
}
/* Quincena en curso. */
function periodoActual(){
  const h = new Date(); const a=h.getFullYear(), m=h.getMonth();
  const q2 = h.getDate()>15;
  const d1 = new Date(a, m, q2?16:1);
  const d2 = q2 ? new Date(a, m+1, 0) : new Date(a, m, 15);
  const f = d => d.toISOString().slice(0,10);
  return {desde:f(d1), hasta:f(d2), dias: q2 ? d2.getDate()-15 : 15,
          et: `${d1.getDate()}/${String(m+1).padStart(2,'0')} – ${d2.getDate()}/${String(d2.getMonth()+1).padStart(2,'0')}/${a}`};
}

function barrasH(datos,{fmt=k,color='var(--c1)',alto=26,gap=11}={}){
  if(!datos.length) return '<p class="empty" style="padding:26px">Sin datos para mostrar</p>';
  const max=Math.max(...datos.map(d=>d.v),1)*1.02, W=640, LW=190, VW=80;
  const bw=W-LW-VW, H=datos.length*(alto+gap);
  const corta=t=>t.length>26?t.slice(0,25)+'…':t;
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">`;
  datos.forEach((d,i)=>{
    const y=i*(alto+gap), w=Math.max(bw*d.v/max,3);
    s+=`<text x="${LW-12}" y="${y+alto/2+5}" text-anchor="end">${esc(corta(d.l))}</text>`;
    s+=`<rect x="${LW}" y="${y}" width="${bw}" height="${alto}" rx="3" fill="var(--sunken)"/>`;
    s+=`<rect x="${LW}" y="${y}" width="${w}" height="${alto}" rx="4" fill="${d.c||color}"
         style="cursor:pointer" onmousemove="showTip(event,'<b>${esc(d.l)}</b><br>${d.tip||fmt(d.v)}')"
         onmouseleave="hideTip()"/>`;
    s+=`<text class="v" x="${LW+bw+9}" y="${y+alto/2+5}">${fmt(d.v)}</text>`;
  });
  return s+'</svg>';
}
function apiladas(labels,series,{fmt=v=>v.toFixed(1).replace('.',',')+' M'}={}){
  const W=680,H=210,PL=42,PB=26,PT=8;
  const tot=labels.map((_,i)=>series.reduce((a,s)=>a+s.d[i],0));
  const max=Math.max(Math.ceil(Math.max(...tot)/8)*8,8), gw=(W-PL)/labels.length, bw=Math.min(gw*.52,46);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img"><g class="grid">`;
  for(let i=0;i<=4;i++){const y=PT+(H-PT-PB)*i/4;
    s+=`<line x1="${PL}" y1="${y}" x2="${W}" y2="${y}"/>`;
    s+=`<text class="v" x="${PL-8}" y="${y+4}" text-anchor="end">${(max*(4-i)/4).toFixed(0)}</text>`;}
  s+='</g>';
  labels.forEach((lb,i)=>{
    const cx=PL+gw*i+gw/2, x=cx-bw/2; let acc=0;
    series.forEach((se,j)=>{
      const v=se.d[i], h=(H-PT-PB)*v/max, y=H-PB-h-acc;
      s+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h-2,1)}" rx="${j===series.length-1?4:2}"
           fill="${se.c}" style="cursor:pointer"
           onmousemove="showTip(event,'<b>${lb} 2026</b><br>${se.n}: ${fmt(v)}<br>Total ${fmt(tot[i])}')"
           onmouseleave="hideTip()"/>`;
      acc+=h;});
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${lb}</text>`;});
  return s+'</svg>';
}
const leyenda = its => '<div class="lgd">'+its.map(i=>
  `<span><i style="background:${i.c}"></i>${i.n}</span>`).join('')+'</div>';

    ${conBusqueda?`<div class="search"><input placeholder="Buscar por nombre, cédula o cargo…"
      value="${esc(FILTRO.texto)}" oninput="FILTRO.texto=this.value;pintar();
      const i=document.querySelector('.search input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}"></div>`:''}
    ${fija?`<span class="chip">Tienda <b>${esc(nomTienda(fija))}</b></span>`
      :`<select class="filtro" onchange="FILTRO.tienda=this.value;pintar()">

    ${conEstado?`<select class="filtro" style="min-width:150px" onchange="FILTRO.estado=this.value;pintar()">

        `<option value="${v}" ${FILTRO.estado===v?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}
     </select>`:''}
    ${(FILTRO.tienda||FILTRO.texto||FILTRO.estado)?
      `<span class="selpill">${[FILTRO.tienda&&nomTienda(FILTRO.tienda),
        FILTRO.estado, FILTRO.texto&&`“${esc(FILTRO.texto)}”`].filter(Boolean).join(' · ')}
       <button onclick="FILTRO={tienda:'',texto:'',estado:''};pintar()" title="Quitar filtros">×</button></span>`:''}
    <div class="spacer"></div>${acciones}</div>`;
}
