<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --bg:#F2F7F8; --surface:#FFFFFF; --surface-2:#F8FBFC; --sunken:#E9F1F3;
  --ink:#132227; --ink-2:#486066; --ink-3:#7B9298; --ink-4:#A8BCC1;
  --line:#DCE8EA; --line-2:#EAF2F4;
  --brand:#0A7C88; --brand-2:#0096A6; --brand-soft:#DEF4F6; --brand-logo:#5CE1E8;
  --c1:#0096A6; --c2:#C0631A; --c3:#7C3AED; --c4:#BE185D;
  --good:#1F7A55; --good-soft:#DFF2EA;
  --warn:#9A6410; --warn-soft:#FBEFD8;
  --crit:#A8322B; --crit-soft:#FBE4E2;
  --info:#1D6E8C; --info-soft:#DFEEF4;
  --shadow-sm:0 1px 2px rgba(19,34,39,.06);
  --shadow:0 1px 3px rgba(19,34,39,.07), 0 10px 28px -16px rgba(19,34,39,.22);
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1416; --surface:#131F22; --surface-2:#18262A; --sunken:#1D2E33;
  --ink:#E4EFF1; --ink-2:#A3BAC0; --ink-3:#728A90; --ink-4:#4E666C;
  --line:#22363B; --line-2:#1B2C30;
  --brand:#3FCAD6; --brand-2:#1AA3AF; --brand-soft:#0F2E32; --brand-logo:#5CE1E8;
  --c1:#1AA3AF; --c2:#CE7A26; --c3:#9B7BEA; --c4:#E05287;
  --good:#4FB489; --good-soft:#102A22;
  --warn:#D3A257; --warn-soft:#2E2416;
  --crit:#E0857C; --crit-soft:#331B19;
  --info:#6FB2CE; --info-soft:#13262E;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 3px rgba(0,0,0,.45), 0 10px 28px -16px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#0C1416; --surface:#131F22; --surface-2:#18262A; --sunken:#1D2E33;
  --ink:#E4EFF1; --ink-2:#A3BAC0; --ink-3:#728A90; --ink-4:#4E666C;
  --line:#22363B; --line-2:#1B2C30;
  --brand:#3FCAD6; --brand-2:#1AA3AF; --brand-soft:#0F2E32; --brand-logo:#5CE1E8;
  --c1:#1AA3AF; --c2:#CE7A26; --c3:#9B7BEA; --c4:#E05287;
  --good:#4FB489; --good-soft:#102A22;
  --warn:#D3A257; --warn-soft:#2E2416;
  --crit:#E0857C; --crit-soft:#331B19;
  --info:#6FB2CE; --info-soft:#13262E;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 3px rgba(0,0,0,.45), 0 10px 28px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"DM Sans","Segoe UI",system-ui,sans-serif;font-size:14.5px;line-height:1.58;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"cv05" 1}
h1,h2,h3,h4{font-family:"Playfair Display",Georgia,"Times New Roman",serif;margin:0;
  line-height:1.18;text-wrap:balance;letter-spacing:-.012em;font-weight:600}
p{margin:0}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:3px}
.mono{font-family:"IBM Plex Mono","SFMono-Regular",monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;text-align:right}

/* ================= LOGIN ================= */
#login{position:fixed;inset:0;z-index:200;background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:24px}
.loginbox{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);padding:38px 34px}
.logo{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.logomark{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:block;
  box-shadow:0 1px 4px rgba(19,34,39,.14)}
.logobig{width:96px;height:96px;border-radius:50%;display:block;margin:0 auto 18px;
  box-shadow:0 4px 18px -6px rgba(19,34,39,.28)}
.logotext{font-family:"Playfair Display",Georgia,serif;font-size:19px;font-weight:600;letter-spacing:.005em;line-height:1.1}
.logotext em{display:block;font-family:"DM Sans",sans-serif;font-style:normal;font-size:9px;
  letter-spacing:.28em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-top:1px}
.loginbox .sub{color:var(--ink-3);font-size:13.5px;margin-bottom:26px}
label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:7px}
input,select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:5px;
  background:var(--surface-2);color:var(--ink);font:inherit;font-size:14px}
.field{margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 16px;border-radius:5px;font-weight:600;font-size:14px;
  background:var(--brand);color:#fff;width:100%;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--line);width:auto}
.btn.ghost:hover{background:var(--sunken)}
.btn.sm{padding:5px 11px;font-size:13px;width:auto}
.roles{margin-top:22px;padding-top:20px;border-top:1px solid var(--line-2)}
.roles .hint{font-size:12px;color:var(--ink-3);margin-bottom:11px}
.rolebtn{display:flex;gap:11px;align-items:center;width:100%;padding:9px 11px;border-radius:5px;
  border:1px solid var(--line);background:var(--surface-2);margin-bottom:7px;text-align:left;
  transition:border-color .15s,background .15s}
.rolebtn:hover{border-color:var(--brand);background:var(--brand-soft)}
.rolebtn .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.rolebtn b{display:block;font-size:13.5px;font-weight:600}
.rolebtn span{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.3}

/* ================= SHELL ================= */
#app{display:none;min-height:100vh}
#app.on{display:grid;grid-template-columns:216px 1fr}
aside{background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brandrow{padding:16px 18px;border-bottom:1px solid var(--line-2)}
nav{padding:12px 10px;flex:1;overflow-y:auto}
.navgrp{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4);
  font-weight:700;padding:15px 10px 7px}
.navitem{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:5px;
  color:var(--ink-2);font-size:14px;text-align:left;margin-bottom:1px;transition:background .12s}
.navitem:hover{background:var(--sunken);color:var(--ink)}
.navitem.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.navitem .ic{width:16px;text-align:center;opacity:.85;flex-shrink:0}
.navitem .badge{margin-left:auto;background:var(--crit);color:#fff;font-size:10.5px;font-weight:700;
  padding:0 6px;border-radius:9px;min-width:18px;text-align:center}
.userbox{padding:12px;border-top:1px solid var(--line-2);display:flex;gap:10px;align-items:center}
.userbox .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.userbox b{display:block;font-size:13px;font-weight:600;line-height:1.25}
.userbox span{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.25}

main{min-width:0}
header.top{background:var(--surface);border-bottom:1px solid var(--line);
  padding:0 26px;height:56px;display:flex;align-items:center;gap:18px;
  position:sticky;top:0;z-index:40}
header.top h1{font-size:20px;font-weight:600;letter-spacing:-.015em}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:20px;
  background:var(--sunken);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.chip b{color:var(--ink);font-family:"IBM Plex Mono","SFMono-Regular",monospace;font-size:12px;font-weight:500}
.dot{width:6px;height:6px;border-radius:50%;background:var(--good);flex-shrink:0}
.wrap{padding:24px 26px 70px;max-width:1280px}

/* ================= COMPONENTS ================= */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow-sm)}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:12px}
.card-h h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
.card-h .sub{font-size:12.5px;color:var(--ink-3)}
.card-b{padding:18px}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 17px;box-shadow:var(--shadow-sm)}
.tile .lab{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.tile .val{font-family:"Playfair Display",Georgia,serif;font-size:31px;font-weight:600;
  letter-spacing:-.028em;line-height:1;font-variant-numeric:tabular-nums lining-nums;
  font-feature-settings:"tnum" 1}
.tile .val small{font-size:16px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.tile .meta{font-size:12.5px;color:var(--ink-3);margin-top:7px;display:flex;align-items:center;
  gap:6px;line-height:1.4}
.tile.alert{border-left:3px solid var(--crit)}
.tile.warn{border-left:3px solid var(--warn)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:2px 9px;border-radius:11px;white-space:nowrap;letter-spacing:.01em}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.wa{background:var(--warn-soft);color:var(--warn)}
.pill.cr{background:var(--crit-soft);color:var(--crit)}
.pill.in{background:var(--info-soft);color:var(--info)}
.pill.nu{background:var(--sunken);color:var(--ink-3)}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
thead th{text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;padding:10px 15px;border-bottom:1px solid var(--line);
  background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
tbody td{padding:10px 15px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
th.num,td.num{text-align:right;font-family:"IBM Plex Mono","SFMono-Regular",monospace;
  font-size:12.5px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
td.num{color:var(--ink);font-weight:400}
td.num b{font-weight:600}
.who{display:flex;align-items:center;gap:9px}
.who .av{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;
  font-size:10.5px;font-weight:700;color:#fff;flex-shrink:0}
.who b{display:block;font-weight:600;font-size:13.5px;line-height:1.25}
.who span{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.25}
.locked{color:var(--ink-4);font-style:italic;font-size:12.5px}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{padding:8px 14px;font-size:14px;color:var(--ink-3);border-bottom:2px solid transparent;
  white-space:nowrap;font-weight:500}
.tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.tab:hover{color:var(--ink)}

.note{border-radius:var(--r);padding:13px 16px;font-size:13.5px;display:flex;gap:11px;
  align-items:flex-start;border:1px solid var(--line);background:var(--surface)}
.note.cr{background:var(--crit-soft);border-color:transparent}
.note.wa{background:var(--warn-soft);border-color:transparent}
.note.in{background:var(--info-soft);border-color:transparent}
.note .ni{font-weight:700;flex-shrink:0}
.note b{font-weight:700}

.steps{display:flex;gap:0;margin-bottom:22px;border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;background:var(--surface)}
.step{flex:1;padding:12px 15px;border-right:1px solid var(--line-2);min-width:130px}
.step:last-child{border-right:0}
.step .n{font-family:"IBM Plex Mono","SFMono-Regular",monospace;font-size:11px;color:var(--ink-4);font-weight:500}
.step b{display:block;font-size:13.5px;font-weight:600;margin-top:1px}
.step.done{background:var(--good-soft)}
.step.done .n{color:var(--good)}
.step.now{background:var(--brand-soft)}
.step.now .n{color:var(--brand)}

.recibo{max-width:460px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);font-size:13px}
.recibo .rh{padding:15px 20px;text-align:center;border-bottom:1px dashed var(--line)}

.recibo .rh b{display:block;font-family:"Playfair Display",Georgia,serif;font-size:15.5px;letter-spacing:.01em}
.recibo .rh span{font-size:11.5px;color:var(--ink-3)}
.recibo .rs{padding:12px 20px;border-bottom:1px dashed var(--line)}
.recibo .rs:last-child{border-bottom:0}
.recibo .rl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--brand);
  font-weight:700;margin-bottom:7px}
.rline{display:flex;justify-content:space-between;gap:14px;padding:2px 0}
.rline span:last-child{font-family:"IBM Plex Mono","SFMono-Regular",monospace;
  font-variant-numeric:tabular-nums;font-size:12.5px;letter-spacing:-.01em;white-space:nowrap}
.rline span:first-child{color:var(--ink-2)}
.rline.tot{font-weight:700;border-top:1px solid var(--line);margin-top:7px;padding-top:7px}
.rline .u{color:var(--ink-3);font-size:11px}
.recibo .net{background:var(--sunken);font-weight:700;font-size:14.5px}

svg{max-width:760px;display:block}
svg .grid line{stroke:var(--line-2);stroke-width:1}
svg text{fill:var(--ink-3);font-family:"DM Sans",sans-serif;font-size:12.5px}
svg text.v{fill:var(--ink-2);font-family:"IBM Plex Mono","SFMono-Regular",monospace;font-size:11.5px}
.lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:12px}
.lgd i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:-1px}

.empty{padding:50px 20px;text-align:center;color:var(--ink-3)}
.empty b{display:block;font-family:"Playfair Display",Georgia,serif;font-size:17px;color:var(--ink-2);margin-bottom:5px}

@media(max-width:900px){
  #app.on{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto}
  aside .brandrow{border-bottom:0;border-right:1px solid var(--line-2);white-space:nowrap}
  nav{display:flex;padding:8px;gap:4px}
  .navgrp,.userbox{display:none}
  .navitem{white-space:nowrap;margin:0}
  .wrap{padding:18px 16px 60px}
  header.top{padding:0 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
/* ============ AÑADIDOS: filtros, modales, avisos, importador ============ */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{position:relative;flex:1;min-width:180px;max-width:300px}
.search input{padding-left:32px}
.search::before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--ink-3);font-size:16px;pointer-events:none}
select.filtro{width:auto;min-width:170px;padding-right:30px;cursor:pointer}
.selpill{display:inline-flex;align-items:center;gap:6px;padding:5px 8px 5px 12px;border-radius:20px;
  background:var(--brand-soft);color:var(--brand);font-size:12.5px;font-weight:600}
.selpill button{color:inherit;font-size:15px;line-height:1;opacity:.6;padding:0 2px}
.selpill button:hover{opacity:1}

.modal-bg{position:fixed;inset:0;background:rgba(19,34,39,.45);backdrop-filter:blur(2px);
  z-index:150;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;
  overflow-y:auto}
.modal{background:var(--surface);border-radius:12px;box-shadow:0 20px 60px -20px rgba(0,0,0,.4);
  width:100%;max-width:620px;border:1px solid var(--line)}
.modal.wide{max-width:860px}
.modal-h{padding:18px 24px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:12px}
.modal-h h3{font-size:19px;font-weight:600}
.modal-h .x{margin-left:auto;font-size:22px;color:var(--ink-3);line-height:1;padding:2px 6px;border-radius:4px}
.modal-h .x:hover{background:var(--sunken);color:var(--ink)}
.modal-b{padding:22px 24px}
.modal-f{padding:16px 24px;border-top:1px solid var(--line-2);display:flex;gap:10px;
  justify-content:flex-end;flex-wrap:wrap}
.frow{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:14px}
.frow.one{grid-template-columns:1fr}
.hintx{font-size:12px;color:var(--ink-3);margin-top:5px;line-height:1.4}

.drop{border:2px dashed var(--line);border-radius:10px;padding:32px 20px;text-align:center;
  background:var(--surface-2);transition:border-color .15s,background .15s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop .big{font-size:30px;line-height:1;margin-bottom:10px;color:var(--brand)}
.drop b{display:block;font-family:"Playfair Display",Georgia,serif;font-size:17px;margin-bottom:4px}
.drop span{font-size:13px;color:var(--ink-3)}
textarea{width:100%;min-height:130px;padding:11px 13px;border:1px solid var(--line);border-radius:6px;
  background:var(--surface-2);color:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:12.5px;
  resize:vertical;line-height:1.5}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);
  background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:24px;font-size:14px;
  font-weight:500;z-index:400;transition:transform .22s cubic-bezier(.2,.8,.3,1);
  box-shadow:0 8px 28px -8px rgba(0,0,0,.4);max-width:88vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}

.rowact{display:flex;gap:5px;justify-content:flex-end}
.iconbtn{width:28px;height:28px;border-radius:5px;display:grid;place-items:center;
  color:var(--ink-3);font-size:14px;transition:background .12s,color .12s}
.iconbtn:hover{background:var(--sunken);color:var(--ink)}
.iconbtn.del:hover{background:var(--crit-soft);color:var(--crit)}
.previewtbl{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.previewtbl table{min-width:0}
.bad{background:var(--crit-soft)}
.stepnums{display:flex;gap:20px;font-size:13px;color:var(--ink-3);margin-bottom:14px;flex-wrap:wrap}
.stepnums b{color:var(--ink);font-family:"IBM Plex Mono",monospace}
</style>

<style>
/* ============ Recibos imprimibles y usuarios ============ */
.reciboLista{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.rcard{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--surface);
  cursor:pointer;transition:border-color .15s,box-shadow .15s}
.rcard:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.rcard .rn{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.rcard b{display:block;font-size:14.5px;margin:3px 0 2px}
.rcard .rm{font-size:12.5px;color:var(--ink-3)}
.rcard .rv{font-family:"Playfair Display",Georgia,serif;font-size:19px;font-weight:600;margin-top:8px}
.rcard .chk{float:right;width:17px;height:17px;border:1.5px solid var(--line);border-radius:4px;
  display:grid;place-items:center;font-size:11px;color:#fff}
.rcard.sel{border-color:var(--brand);background:var(--brand-soft)}

<script>
/* =====================================================================
   CONEXIÓN CON SUPABASE
   La anon key es pública por diseño: va en el navegador y lo que protege
   los datos son las políticas RLS, no el secreto de esta clave.
   ===================================================================== */
const CFG = {
  url: localStorage.getItem('sb_url') || 'https://aiwbjnoafonhjesjllib.supabase.co',
  key: localStorage.getItem('sb_key') || '',
};
let sb = null;
function conectar(){
  if(!CFG.url || !CFG.key) return false;
  try{ sb = window.supabase.createClient(CFG.url, CFG.key); return true; }
  catch(e){ console.error(e); return false; }
}

/* =====================================================================
   ESTADO — se llena desde Supabase al iniciar sesión
   ===================================================================== */
const TASA = 250;
const bs  = n => (+n||0).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});
const k   = n => n>=1e6 ? (n/1e6).toFixed(1).replace('.',',')+' M'
                : n>=1e3 ? Math.round(n/1e3)+' K' : Math.round(n);
const ini = s => (s||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const COL = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)'];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = (()=>{let n=1000;return ()=>'tmp'+(++n)})();

const ESTADO = {
 empresa:null, tiendas:[], empleados:[], cargos:[], usuarios:[],
 asistencia:{}, marcajes:[], incidencias:[], nominaAprobada:false,
 param:[], auditoria:[],
};

const ROL_ET = {gerente_general:'Gerente General', supervisor_tienda:'Supervisor de Tienda',
  supervisor_auxiliar:'Supervisor Auxiliar', empleado:'Empleado'};

/* Sesión real: se llena con el perfil que devuelve la base de datos */
let SESION = null;         // {id, nombre, email, rol, tienda_id, tienda_codigo}
let VISTA='panel';
let FILTRO={tienda:'', texto:'', estado:''};
let CARGANDO=false;

const R = () => ({
  n: SESION?.nombre || '—',
  r: ROL_ET[SESION?.rol] || '—',
  av: {gerente_general:'var(--brand)', supervisor_tienda:'var(--c2)',
       supervisor_auxiliar:'var(--c3)', empleado:'var(--c4)'}[SESION?.rol] || 'var(--ink-3)',
  t: SESION?.tienda_codigo || null,
  salarios: SESION?.rol==='gerente_general' ? true
          : SESION?.rol==='supervisor_tienda' ? true
          : SESION?.rol==='empleado' ? 'propio' : false,
  admin: SESION?.rol==='gerente_general',
});
const ROL = () => SESION?.rol;
const esGerente = () => SESION?.rol==='gerente_general';

const tiendaFija = () => R().t;
const nomTienda = cod => (ESTADO.tiendas.find(t=>t.codigo===cod)||{}).nombre || cod || '—';
const tiendaUUID = cod => (ESTADO.tiendas.find(t=>t.codigo===cod)||{}).id || null;

function empleadosVisibles(){
  let L = ESTADO.empleados.slice();
  if(tiendaFija()) L = L.filter(e=>e.t===tiendaFija());
  if(ROL()==='empleado') L = L.filter(e=>e.usuario_id===SESION.id);
  if(FILTRO.tienda) L = L.filter(e=>e.t===FILTRO.tienda);
  if(FILTRO.estado) L = L.filter(e=>e.est===FILTRO.estado);
  if(FILTRO.texto){
    const q = FILTRO.texto.toLowerCase();
    L = L.filter(e=>(e.n+' '+e.ci+' '+e.cargo+' '+nomTienda(e.t)).toLowerCase().includes(q));
  }
  return L;
}
const anios = ing => { const d=new Date(ing);
  return isNaN(d)?0:Math.max(0,Math.floor((Date.now()-d)/31557600000)); };
const fechaCorta = f => { if(!f) return '—'; const [a,m,d]=String(f).slice(0,10).split('-');
  return d?`${d}/${m}/${a}`:f; };
const hoy = () => new Date().toISOString().slice(0,10);

/* =====================================================================
   AVISOS Y MODALES
   ===================================================================== */
let _toastT;
function aviso(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(_toastT); _toastT=setTimeout(()=>t.classList.remove('on'),3200);
}
function modal(html){
  document.getElementById('modalhost').innerHTML =
    `<div class="modal-bg" onclick="if(event.target===this)cerrarModal()">${html}</div>`;
  document.body.style.overflow='hidden';
  const f=document.querySelector('.modal input,.modal select,.modal textarea'); if(f)f.focus();
}
function cerrarModal(){
  document.getElementById('modalhost').innerHTML='';
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') cerrarModal(); });

/* Errores de Supabase traducidos a algo que se pueda leer */
function explicar(error){
  if(!error) return '';
  const m = error.message || String(error);
  if(/Invalid login credentials/i.test(m)) return 'Correo o contraseña incorrectos';
  if(/Email not confirmed/i.test(m)) return 'Falta confirmar el correo: revisa tu bandeja de entrada';
  if(/duplicate key.*cedula/i.test(m)) return 'Ya existe un empleado con esa cédula';
  if(/duplicate key.*codigo/i.test(m)) return 'Ya existe una tienda con ese código';
  if(/violates row-level security/i.test(m)) return 'Tu rol no tiene permiso para hacer esto';
  if(/violates foreign key/i.test(m)) return 'Hay registros que dependen de este dato';
  if(/Failed to fetch|NetworkError/i.test(m)) return 'Sin conexión con la base de datos';
  if(/JWT|expired/i.test(m)) return 'Tu sesión expiró: vuelve a entrar';
  return m;
}
async function conError(fn, exito){
  try{
    const { data, error } = await fn();
    if(error) throw error;
    if(exito) aviso(exito);
    return data;
  }catch(e){ aviso(explicar(e)); return null; }
}
function auditar(){}   /* la auditoría real la escriben los triggers de la base */
</script>
<script>
/* =====================================================================
   ACCESO A DATOS — todo pasa por Supabase con la sesión del usuario
   ===================================================================== */

async function cargarTodo(){
  CARGANDO=true; pintar();
  const [emp, tie, car, emps, sal, usr, par] = await Promise.all([
    sb.from('empresas').select('*').limit(1).maybeSingle(),
    sb.from('tiendas').select('*').order('codigo'),
    sb.from('cargos').select('*').order('nombre'),
    sb.from('empleados').select('*').order('primer_apellido'),
    sb.from('historial_salarios').select('empleado_id,salario_base,moneda_salario,vigente_desde,vigente_hasta'),
    sb.from('v_usuarios').select('*'),
    sb.from('parametros_legales').select('*').is('vigente_hasta',null).order('clave'),
  ]);

  ESTADO.empresa  = emp.data || null;
  ESTADO.tiendas  = tie.data || [];
  ESTADO.cargos   = car.data || [];
  ESTADO.usuarios = usr.data || [];
  ESTADO.param    = (par.data||[]).map(p=>[p.descripcion, formatoParam(p), p.vigente_desde,
                     [p.gaceta_oficial,p.fundamento].filter(Boolean).join(' · ')]);

  // Salario vigente por empleado
  const salPor = {};
  (sal.data||[]).filter(s=>!s.vigente_hasta).forEach(s=>salPor[s.empleado_id]=s);

  const codPorId = {}; ESTADO.tiendas.forEach(t=>codPorId[t.id]=t.codigo);
  const cargoPorId = {}; ESTADO.cargos.forEach(c=>cargoPorId[c.id]=c.nombre);

  ESTADO.empleados = (emps.data||[]).map(e=>({
    id:e.id, ci:e.cedula, n:e.nombre_completo,
    cargo: cargoPorId[e.cargo_id] || '—',
    cargo_id:e.cargo_id, t: codPorId[e.tienda_id] || '',
    tienda_id:e.tienda_id, ing:e.fecha_ingreso, est:e.estado,
    usuario_id:e.usuario_id, tipo_nomina:e.tipo_nomina,
    sal: salPor[e.id] ? (salPor[e.id].moneda_salario==='USD'
          ? +salPor[e.id].salario_base : +salPor[e.id].salario_base/TASA) : 0,
    moneda: salPor[e.id]?.moneda_salario || 'USD',
  }));

  CARGANDO=false;
  const err=[emp,tie,car,emps,usr].map(r=>r.error).filter(Boolean);
  if(err.length) aviso(explicar(err[0]));
}
function formatoParam(p){
  if(p.unidad==='porcentaje') return (p.valor*100).toFixed(2).replace('.',',')+' %';
  if(p.moneda==='USD') return 'USD '+bs(p.valor);
  if(p.moneda==='VES') return 'Bs. '+bs(p.valor);
  return String(+p.valor).replace('.',',');
}

/* ---------- TIENDAS ---------- */
async function crearTienda(d){
  const r = await conError(()=>sb.from('tiendas').insert({
    empresa_id: ESTADO.empresa.id, codigo:d.codigo.toUpperCase(), nombre:d.nombre,
    estado_pais:d.estado_pais, ciudad:d.ciudad, direccion:d.direccion,
    telefono:d.telefono, activa:true}).select().single(), 'Tienda creada');
  if(r) { ESTADO.tiendas.push(r); ESTADO.tiendas.sort((a,b)=>a.codigo.localeCompare(b.codigo)); }
  return r;
}
async function editarTienda(id,d){
  const r = await conError(()=>sb.from('tiendas').update({
    nombre:d.nombre, estado_pais:d.estado_pais, ciudad:d.ciudad,
    direccion:d.direccion, telefono:d.telefono}).eq('id',id).select().single(), 'Tienda actualizada');
  if(r) Object.assign(ESTADO.tiendas.find(t=>t.id===id), r);
  return r;
}
async function eliminarTienda(id){
  const r = await conError(()=>sb.from('tiendas').delete().eq('id',id).select(), 'Tienda eliminada');
  if(r) ESTADO.tiendas = ESTADO.tiendas.filter(t=>t.id!==id);
  return r;
}
async function cambiarActivaTienda(id,activa){
  const r = await conError(()=>sb.from('tiendas').update({activa}).eq('id',id).select().single());
  if(r){ Object.assign(ESTADO.tiendas.find(t=>t.id===id), r);
         aviso(r.nombre+(activa?' reactivada':' desactivada')); }
  return r;
}

/* ---------- CARGOS ---------- */
async function cargoIdDe(nombre){
  if(!nombre) return null;
  const existe = ESTADO.cargos.find(c=>c.nombre.toLowerCase()===nombre.toLowerCase());
  if(existe) return existe.id;
  const r = await conError(()=>sb.from('cargos').insert({
    empresa_id:ESTADO.empresa.id, nombre, departamento:'Operaciones'}).select().single());
  if(r) ESTADO.cargos.push(r);
  return r ? r.id : null;
}

/* ---------- EMPLEADOS ---------- */
function partirNombre(txt){
  const p = txt.trim().split(/\s+/);
  if(p.length===1) return {pn:p[0], sn:null, pa:'', sa:null};
  if(p.length===2) return {pn:p[0], sn:null, pa:p[1], sa:null};
  if(p.length===3) return {pn:p[0], sn:null, pa:p[1], sa:p[2]};
  return {pn:p[0], sn:p[1], pa:p[2], sa:p.slice(3).join(' ')};
}
async function crearEmpleado(d){
  const {pn,sn,pa,sa} = partirNombre(d.n);
  const cargo_id = await cargoIdDe(d.cargo);
  const emp = await conError(()=>sb.from('empleados').insert({
    empresa_id: ESTADO.empresa.id, tienda_id: tiendaUUID(d.t), cargo_id,
    cedula:d.ci, primer_nombre:pn, segundo_nombre:sn, primer_apellido:pa, segundo_apellido:sa,
    fecha_ingreso:d.ing, estado:d.est||'activo', tipo_nomina:d.tipo_nomina||'quincenal',
  }).select().single(), 'Empleado creado');
  if(!emp) return null;
  if(d.sal>0){
    await conError(()=>sb.from('historial_salarios').insert({
      empleado_id:emp.id, vigente_desde:d.ing, salario_base:d.sal,
      moneda_salario:'USD', motivo:'Carga inicial'}));
  }
  ESTADO.empleados.push({id:emp.id, ci:emp.cedula, n:emp.nombre_completo, cargo:d.cargo,
    cargo_id, t:d.t, tienda_id:emp.tienda_id, ing:emp.fecha_ingreso, est:emp.estado,
    usuario_id:null, sal:d.sal, moneda:'USD', tipo_nomina:emp.tipo_nomina});
  return emp;
}
async function editarEmpleado(id,d){
  const {pn,sn,pa,sa} = partirNombre(d.n);
  const cargo_id = await cargoIdDe(d.cargo);
  const emp = await conError(()=>sb.from('empleados').update({
    tienda_id: tiendaUUID(d.t), cargo_id, cedula:d.ci,
    primer_nombre:pn, segundo_nombre:sn, primer_apellido:pa, segundo_apellido:sa,
    fecha_ingreso:d.ing, estado:d.est}).eq('id',id).select().single(), 'Cambios guardados');
  if(!emp) return null;
  const local = ESTADO.empleados.find(e=>e.id===id);
  // El salario se versiona: nunca se pisa la vigencia anterior
  if(d.sal>0 && Math.abs(d.sal-local.sal)>0.009){
    await conError(()=>sb.from('historial_salarios').insert({
      empleado_id:id, vigente_desde:hoy(), salario_base:d.sal,
      moneda_salario:'USD', motivo:'Ajuste salarial'}));
    local.sal=d.sal;
  }
  Object.assign(local,{ci:emp.cedula, n:emp.nombre_completo, cargo:d.cargo, cargo_id,
    t:d.t, tienda_id:emp.tienda_id, ing:emp.fecha_ingreso, est:emp.estado});
  return emp;
}
async function eliminarEmpleado(id){
  const r = await conError(()=>sb.from('empleados').delete().eq('id',id).select(), 'Empleado eliminado');
  if(r) ESTADO.empleados = ESTADO.empleados.filter(e=>e.id!==id);
  return r;
}
async function crearEmpleadosEnLote(filas){
  let creados=0, fallos=[];
  for(const f of filas){
    const r = await crearEmpleadoSilencioso(f);
    r ? creados++ : fallos.push(f.ci);
  }
  return {creados, fallos};
}
async function crearEmpleadoSilencioso(d){
  try{
    const {pn,sn,pa,sa} = partirNombre(d.n);
    const cargo_id = await cargoIdDe(d.cargo);
    const {data:emp, error} = await sb.from('empleados').insert({
      empresa_id: ESTADO.empresa.id, tienda_id: tiendaUUID(d.t), cargo_id,
      cedula:d.ci, primer_nombre:pn, segundo_nombre:sn, primer_apellido:pa, segundo_apellido:sa,
      fecha_ingreso:d.ing, estado:'activo', tipo_nomina:'quincenal'}).select().single();
    if(error) throw error;
    if(d.sal>0) await sb.from('historial_salarios').insert({
      empleado_id:emp.id, vigente_desde:d.ing, salario_base:d.sal,
      moneda_salario:'USD', motivo:'Carga masiva'});
    ESTADO.empleados.push({id:emp.id, ci:emp.cedula, n:emp.nombre_completo, cargo:d.cargo,
      cargo_id, t:d.t, tienda_id:emp.tienda_id, ing:emp.fecha_ingreso, est:'activo',
      usuario_id:null, sal:d.sal, moneda:'USD'});
    return true;
  }catch(e){ console.error(d.ci, e); return false; }
}

<script>
/* =====================================================================
   IMPORTACIÓN DE EXCEL
   Tres caminos: .xlsx real (ZIP + XML), .csv, o pegar desde Excel (TSV).
   El .xlsx se descomprime con DecompressionStream, sin librerías externas.
   ===================================================================== */

/* --- ZIP mínimo: localiza y descomprime una entrada por nombre --- */
async function zipEntradas(buf){
  const dv=new DataView(buf), U=new Uint8Array(buf), out={};
  // El directorio central va al final; se busca su firma hacia atrás
  let eocd=-1;
  for(let i=U.length-22;i>=0 && i>U.length-66000;i--)
    if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}
  if(eocd<0) throw new Error('El archivo no parece un .xlsx válido');
  const nEnt=dv.getUint16(eocd+10,true);
  let p=dv.getUint32(eocd+16,true);
  for(let i=0;i<nEnt;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const metodo=dv.getUint16(p+10,true), comp=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);
    const off=dv.getUint32(p+42,true);
    const nombre=new TextDecoder().decode(U.subarray(p+46,p+46+nl));
    // Cabecera local: el tamaño de "extra" puede diferir del central
    const lnl=dv.getUint16(off+26,true), lel=dv.getUint16(off+28,true);
    const ini=off+30+lnl+lel;
    out[nombre]={metodo,datos:U.subarray(ini,ini+comp)};
    p+=46+nl+el+cl;
  }
  return out;
}
async function inflar(entrada){
  if(!entrada) return '';
  if(entrada.metodo===0) return new TextDecoder().decode(entrada.datos);
  if(typeof DecompressionStream==='undefined')
    throw new Error('Este navegador no puede descomprimir .xlsx. Guarda el archivo como CSV y vuelve a intentarlo.');
  const ds=new DecompressionStream('deflate-raw');
  const s=new Blob([entrada.datos]).stream().pipeThrough(ds);
  return await new Response(s).text();
}
function colAIndice(ref){           // "AB12" -> 27
  let n=0; for(const c of ref.replace(/\d+/g,'')) n=n*26+(c.charCodeAt(0)-64);
  return n-1;
}
async function leerXLSX(buf){
  const z=await zipEntradas(buf);
  const dp=new DOMParser();
  let shared=[];
  const ssKey=Object.keys(z).find(n=>/sharedStrings\.xml$/i.test(n));
  if(ssKey){
    const d=dp.parseFromString(await inflar(z[ssKey]),'application/xml');
    shared=[...d.getElementsByTagName('si')].map(si=>
      [...si.getElementsByTagName('t')].map(t=>t.textContent).join(''));
  }
  const shKey=Object.keys(z).find(n=>/xl\/worksheets\/sheet1\.xml$/i.test(n))
           || Object.keys(z).find(n=>/xl\/worksheets\/.*\.xml$/i.test(n));
  if(!shKey) throw new Error('No se encontró ninguna hoja dentro del archivo');
  const d=dp.parseFromString(await inflar(z[shKey]),'application/xml');
  const filas=[];
  for(const row of d.getElementsByTagName('row')){
    const f=[];
    for(const c of row.getElementsByTagName('c')){
      const idx=colAIndice(c.getAttribute('r')||'A1');
      const v=c.getElementsByTagName('v')[0];
      let val='';
      if(c.getAttribute('t')==='s') val = shared[+(v?v.textContent:0)] ?? '';
      else if(c.getAttribute('t')==='inlineStr')
        val=[...c.getElementsByTagName('t')].map(t=>t.textContent).join('');
      else val = v ? v.textContent : '';
      f[idx]=val;
    }
    filas.push([...f].map(x=>x??''));
  }
  return filas;
}
function partirCSV(txt){
  const sep = txt.includes('\t') ? '\t' : (txt.split('\n')[0].split(';').length > txt.split('\n')[0].split(',').length ? ';' : ',');
  return txt.replace(/\r/g,'').split('\n').filter(l=>l.trim()).map(linea=>{
    const out=[]; let cur='', dentro=false;
    for(let i=0;i<linea.length;i++){
      const ch=linea[i];
      if(ch==='"'){ if(dentro && linea[i+1]==='"'){cur+='"';i++;} else dentro=!dentro; }
      else if(ch===sep && !dentro){ out.push(cur); cur=''; }
      else cur+=ch;
    }
    out.push(cur); return out.map(s=>s.trim());
  });
}

/* =====================================================================
   MAPEO DE COLUMNAS — dos tipos de carga: empleados y asistencia
   ===================================================================== */
const ESQUEMAS = {
 empleados:{
  et:'Empleados',
  campos:[
   {k:'ci',    et:'Cédula',        oblig:true,  claves:['cedula','cédula','ci','documento','c.i.','identificacion','identificación']},
   {k:'n',     et:'Nombre',        oblig:true,  claves:['nombre','nombres','empleado','trabajador','apellidos y nombres','nombre completo']},
   {k:'cargo', et:'Cargo',         oblig:false, claves:['cargo','puesto','posicion','posición','funcion','función']},
   {k:'t',     et:'Tienda',        oblig:false, claves:['tienda','sucursal','local','codigo tienda','código tienda','sede']},
   {k:'ing',   et:'Fecha ingreso', oblig:false, claves:['ingreso','fecha ingreso','fecha de ingreso','f. ingreso','fecha_ingreso','fecha de entrada']},
   {k:'sal',   et:'Salario USD',   oblig:false, claves:['salario','sueldo','salario usd','sueldo usd','monto','remuneracion','remuneración']},
  ]},
 asistencia:{
  et:'Marcajes de asistencia',
  campos:[
   {k:'ci',     et:'Cédula',            oblig:true,  claves:['cedula','cédula','ci','documento','c.i.']},
   {k:'fecha',  et:'Fecha',             oblig:true,  claves:['fecha','dia','día','fecha marcaje','jornada']},
   {k:'ent',    et:'Entrada',           oblig:false, claves:['entrada','hora entrada','llegada','ingreso','entrada trabajo','hora de entrada']},
   {k:'salAlm', et:'Salida a almuerzo', oblig:false, claves:['salida almuerzo','salida a almuerzo','inicio almuerzo','salida comida','almuerzo salida']},
   {k:'regAlm', et:'Regreso de almuerzo',oblig:false,claves:['regreso almuerzo','regreso de almuerzo','fin almuerzo','regreso comida','almuerzo regreso','entrada almuerzo']},
   {k:'sal',    et:'Salida',            oblig:false, claves:['salida','hora salida','salida trabajo','egreso','hora de salida']},
  ]},
};
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
function detectarMapa(cab,campos){
  const m={};
  campos.forEach(c=>{
    const i=cab.findIndex(h=>c.claves.includes(norm(h)));
    if(i>=0) m[c.k]=i;
  });
  return m;
}
function fechaExcel(v){
  if(v===''||v==null) return '';
  if(/^\d{5}(\.\d+)?$/.test(String(v))){
    const d=new Date(Date.UTC(1899,11,30)+Math.floor(+v)*864e5);
    return d.toISOString().slice(0,10);
  }
  const m=String(v).match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){ const a=m[3].length===2?'20'+m[3]:m[3];
    return `${a}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  const m2=String(v).match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m2) return `${m2[1]}-${m2[2].padStart(2,'0')}-${m2[3].padStart(2,'0')}`;
  return String(v).slice(0,10);
}
function horaExcel(v){
  if(v===''||v==null) return '';
  const s=String(v).trim();
  if(/^0?\.\d+$/.test(s)){                       // fracción de día que usa Excel
    const min=Math.round(parseFloat(s)*1440);
    return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0');
  }
  const m=s.match(/^(\d{1,2})[:.h](\d{2})/i);
  if(m){
    let h=+m[1]; const pm=/p\.?m\.?/i.test(s), am=/a\.?m\.?/i.test(s);
    if(pm && h<12) h+=12; if(am && h===12) h=0;
    return String(h).padStart(2,'0')+':'+m[2];
  }
  if(/^\d{3,4}$/.test(s)) return s.padStart(4,'0').replace(/(\d{2})(\d{2})/,'$1:$2');
  return '';
}
const aMin = h => { const m=/^(\d{2}):(\d{2})$/.exec(h||''); return m ? +m[1]*60+ +m[2] : null; };
const aHora = m => m==null?'—':String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');

let IMPORT={tipo:'empleados',filas:[],validas:[],errores:[],faltan:[]};

function analizarImportacion(filas){
  const esq=ESQUEMAS[IMPORT.tipo];
  if(!filas || filas.length<2){ aviso('El archivo no tiene filas de datos'); return; }
  const cab=filas[0], mapa=detectarMapa(cab,esq.campos);
  IMPORT.faltan = esq.campos.filter(c=>c.oblig && !(c.k in mapa));
  IMPORT.validas=[]; IMPORT.errores=[];
  const g=(f,c)=>String(f[mapa[c]]??'').trim();

  if(IMPORT.tipo==='empleados'){
    const codigos=new Set(ESTADO.tiendas.map(t=>t.id));
    const nombres={}; ESTADO.tiendas.forEach(t=>nombres[norm(t.n)]=t.id);
    const yaHay=new Set(ESTADO.empleados.map(e=>e.ci));
    const porDefecto = FILTRO.tienda || tiendaFija() || '';
    filas.slice(1).forEach((f,i)=>{
      const ci=g(f,'ci').replace(/[.\s-]/g,'').replace(/^[VE]/i,'');
      let t=g(f,'t').trim();
      if(!t) t = porDefecto;                      // usa la tienda seleccionada
      else if(!codigos.has(t)) t = nombres[norm(t)] || codigos.has(t.toUpperCase()) ? t.toUpperCase() : (nombres[norm(t)]||'');
      if(!codigos.has(t)) t = nombres[norm(g(f,'t'))] || '';
      const fila={ci, n:g(f,'n'), cargo:g(f,'cargo')||'Vendedor', t,
                  ing:fechaExcel(g(f,'ing'))||'2026-01-01',
                  sal:parseFloat(String(g(f,'sal')).replace(/[^\d.,]/g,'').replace(',','.'))||0};
      const err=[];
      if(!/^\d{6,9}$/.test(ci)) err.push('cédula inválida');
      if(!fila.n) err.push('falta el nombre');
      if(!t) err.push(g(f,'t') ? 'tienda no reconocida: "'+g(f,'t')+'"' : 'sin tienda y ninguna seleccionada');
      if(yaHay.has(ci)) err.push('cédula ya registrada');
      if(err.length) IMPORT.errores.push({fila:i+2, datos:fila, err});
      else { IMPORT.validas.push(fila); yaHay.add(ci); }
    });
  } else {
    const porCI={}; ESTADO.empleados.forEach(e=>porCI[e.ci]=e);
    const alcance = FILTRO.tienda || tiendaFija() || '';
    filas.slice(1).forEach((f,i)=>{
      const ci=g(f,'ci').replace(/[.\s-]/g,'').replace(/^[VE]/i,'');
      const emp=porCI[ci];
      const fila={ci, nombre:emp?emp.n:'—', tienda:emp?emp.t:'—',
        fecha:fechaExcel(g(f,'fecha')), ent:horaExcel(g(f,'ent')),
        salAlm:horaExcel(g(f,'salAlm')), regAlm:horaExcel(g(f,'regAlm')), sal:horaExcel(g(f,'sal'))};
      const err=[];
      if(!emp) err.push('no hay ningún empleado con la cédula '+(ci||'vacía'));
      else if(alcance && emp.t!==alcance) err.push('pertenece a '+emp.t+', fuera de la tienda seleccionada');
      if(!/^\d{4}-\d{2}-\d{2}$/.test(fila.fecha)) err.push('fecha inválida');
      if(!fila.ent && !fila.sal) err.push('sin hora de entrada ni de salida');
      const e1=aMin(fila.ent), s1=aMin(fila.sal);
      if(e1!=null && s1!=null && s1<=e1) err.push('la salida no puede ser anterior a la entrada');
      // Horas trabajadas descontando el almuerzo
      const a1=aMin(fila.salAlm), a2=aMin(fila.regAlm);
      const alm = (a1!=null && a2!=null && a2>a1) ? a2-a1 : 0;
      fila.almuerzo=alm;
      fila.horas = (e1!=null && s1!=null) ? +(((s1-e1-alm)/60).toFixed(2)) : 0;
      fila.retardo = e1!=null ? Math.max(0, e1-(9*60+10)) : 0;   // 09:00 + 10 min de tolerancia
      if(err.length) IMPORT.errores.push({fila:i+2, datos:fila, err});
      else IMPORT.validas.push(fila);
    });
  }
  pintarPrevia();
}

function pintarPrevia(){
  const {validas,errores,faltan,tipo}=IMPORT;
  const cuerpo=document.getElementById('impcuerpo');
  if(!cuerpo) return;
  if(faltan.length){
    cuerpo.innerHTML=`<div class="note cr"><span class="ni">▲</span><div>
      No se reconocieron las columnas obligatorias: <b>${faltan.map(f=>f.et).join(', ')}</b>.
      Revisa que la primera fila del archivo tenga los encabezados.</div></div>`;
    botonImport(0); return;
  }
  const enc = tipo==='empleados'
    ? ['Cédula','Nombre','Cargo','Tienda','Ingreso','USD','Estado']
    : ['Cédula','Empleado','Fecha','Entrada','Almuerzo','Salida','Horas','Estado'];
  const fila = v => tipo==='empleados'
    ? `<td class="mono">${esc(v.ci)}</td><td><b>${esc(v.n)}</b></td><td>${esc(v.cargo)}</td>
       <td><span class="pill nu">${esc(v.t)}</span></td><td class="mono">${fechaCorta(v.ing)}</td>
       <td class="num">${v.sal}</td><td><span class="pill ok">Listo</span></td>`
    : `<td class="mono">${esc(v.ci)}</td><td><b>${esc(v.nombre)}</b>
         <div class="mini">${esc(v.tienda)}</div></td>
       <td class="mono">${fechaCorta(v.fecha)}</td><td class="mono">${esc(v.ent||'—')}</td>
       <td class="mono">${v.almuerzo?v.almuerzo+' min':'—'}</td><td class="mono">${esc(v.sal||'—')}</td>
       <td class="num">${v.horas.toFixed(2).replace('.',',')}</td>
       <td>${v.retardo>0?`<span class="pill wa">Retardo ${v.retardo}′</span>`:'<span class="pill ok">Listo</span>'}</td>`;

  cuerpo.innerHTML=`
   <div class="stepnums">
     <span>Listos para cargar <b style="color:var(--good)">${validas.length}</b></span>
     <span>Con problemas <b style="color:${errores.length?'var(--crit)':'var(--ink-3)'}">${errores.length}</b></span>
     <span>Total leído <b>${validas.length+errores.length}</b></span>
     ${tipo==='asistencia'&&validas.length?`<span>Retardos detectados
       <b style="color:var(--warn)">${validas.filter(v=>v.retardo>0).length}</b></span>`:''}
   </div>
   <div class="previewtbl"><table>
     <thead><tr>${enc.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
     <tbody>
     ${validas.slice(0,60).map(v=>`<tr>${fila(v)}</tr>`).join('')}
     ${errores.slice(0,40).map(e=>`<tr class="bad">
       <td class="mono">${esc(e.datos.ci||'—')}</td>
       <td colspan="${enc.length-2}" style="font-size:12.5px;color:var(--crit)">
         Fila ${e.fila}: ${esc(e.err.join(' · '))}</td>
       <td><span class="pill cr">Omitir</span></td></tr>`).join('')}
     </tbody></table></div>
   ${validas.length+errores.length>100?'<p class="hintx">Se muestran las primeras 100 filas; se cargarán todas las válidas.</p>':''}`;
  botonImport(validas.length);
}
function botonImport(n){
  const b=document.getElementById('btnimport'); if(!b) return;
  b.disabled=!n; b.style.opacity=n?1:.45;
  b.textContent = n ? (IMPORT.tipo==='empleados'
      ? `Cargar ${n} empleado${n===1?'':'s'}`
      : `Cargar ${n} marcaje${n===1?'':'s'}`)
    : 'Nada que cargar';
}

async function archivoImport(file){
  if(!file) return;
  try{
    let filas;
    if(/\.xlsx$/i.test(file.name)) filas=await leerXLSX(await file.arrayBuffer());
    else if(/\.(csv|tsv|txt)$/i.test(file.name)) filas=partirCSV(await file.text());
    else if(/\.xls$/i.test(file.name))
      throw new Error('El formato .xls antiguo no se puede leer. Guárdalo como .xlsx o .csv.');
    else throw new Error('Formato no reconocido. Usa .xlsx, .csv o .txt.');
    analizarImportacion(filas);
    aviso('Archivo leído: '+file.name);
  }catch(e){ aviso(e.message); }
}
function pegarImport(txt){
  if(!txt.trim()){ aviso('No pegaste nada'); return; }
  analizarImportacion(partirCSV(txt));
}
function confirmarImport(){
  if(!IMPORT.validas.length) return;
  if(IMPORT.tipo==='empleados'){
    IMPORT.validas.forEach(v=>ESTADO.empleados.push({id:uid(),...v,est:'activo'}));
    auditar('Importó empleados',`${IMPORT.validas.length} desde archivo`);
    aviso(`${IMPORT.validas.length} empleados cargados`);
  } else {
    IMPORT.validas.forEach(v=>{
      ESTADO.marcajes = ESTADO.marcajes.filter(m=>!(m.ci===v.ci && m.fecha===v.fecha));
      ESTADO.marcajes.push(v);
      // El día en curso se refleja de una vez en la asistencia del panel
      if(v.fecha==='2026-08-27'){
        const e=ESTADO.empleados.find(x=>x.ci===v.ci);
        if(e) ESTADO.asistencia[e.id]={ent:v.ent||'—', sal:v.sal||'—',
          est:v.retardo>0?'retardo':(v.ent?'presente':'ausente'), ret:v.retardo};
      }
    });
    auditar('Importó marcajes',`${IMPORT.validas.length} registros de asistencia`);
    aviso(`${IMPORT.validas.length} marcajes cargados`);
  }
  IMPORT={tipo:IMPORT.tipo,filas:[],validas:[],errores:[],faltan:[]};
  cerrarModal(); pintar();
}
</script>
<script>

}
async function guardarEmpleado(id){
  const v = k => document.getElementById('f_'+k).value.trim();
  const ci = v('ci').replace(/[.\s-]/g,'').replace(/^[VE]/i,'');
  if(!/^\d{6,9}$/.test(ci)) return aviso('La cédula debe tener entre 6 y 9 dígitos');
  if(!v('n')) return aviso('Falta el nombre');
  if(!v('t')) return aviso('Selecciona una tienda');
  const b=document.getElementById('btnguardar'); b.disabled=true; b.textContent='Guardando…';
  const datos={ci, n:v('n'), cargo:v('cargo')||'Vendedor', t:v('t'), ing:v('ing'),
               sal:parseFloat(v('sal'))||0, est:v('est')};
  const r = id ? await editarEmpleado(id,datos) : await crearEmpleado(datos);
  b.disabled=false; b.textContent=id?'Guardar cambios':'Crear empleado';
  if(r){ cerrarModal(); pintar(); }
}
function borrarEmpleado(id){
  const e=ESTADO.empleados.find(x=>x.id===id);
  modal(`<div class="modal" style="max-width:450px"><div class="modal-h">
      <h3>Eliminar empleado</h3><button class="x" onclick="cerrarModal()">×</button></div>
    <div class="modal-b"><p>Se eliminará a <b>${esc(e.n)}</b> y su historial salarial.</p>
      <div class="note wa" style="margin-top:14px"><span class="ni">⚑</span>
        <div>En un sistema de nómina lo correcto casi nunca es borrar: es marcar el
        <b>egreso</b> con su fecha y motivo, para conservar el histórico y poder liquidar.
        Si la persona se fue, cambia su estado a <b>Egresado</b> en vez de eliminarla.</div></div></div>
    <div class="modal-f"><button class="btn ghost sm" onclick="cerrarModal()">Cancelar</button>
      <button class="btn sm" style="width:auto;background:var(--crit)"
        onclick="confirmarBorrarEmp('${id}')">Eliminar de todos modos</button></div></div>`);
}
async function confirmarBorrarEmp(id){
  if(await eliminarEmpleado(id)){ cerrarModal(); pintar(); }
}

/* ---------- TIENDAS ---------- */

async function guardarTienda(id){
  const v=k=>{const el=document.getElementById('t_'+k); return el?el.value.trim():''};
  if(!v('nom')) return aviso('Falta el nombre de la tienda');
  if(!id && !v('cod')) return aviso('Falta el código');

               ciudad:v('ciu'), direccion:v('dir'), telefono:v('tel')};

  b.disabled=false; b.textContent=id?'Guardar cambios':'Crear tienda';
  if(r){ cerrarModal(); pintar(); }
}
function borrarTienda(id){
  const t=ESTADO.tiendas.find(x=>x.id===id);
  const n=ESTADO.empleados.filter(e=>e.tienda_id===id).length;
  modal(`<div class="modal" style="max-width:460px"><div class="modal-h">
      <h3>Eliminar ${esc(t.nombre)}</h3><button class="x" onclick="cerrarModal()">×</button></div>

      ${n?`<div class="note cr"><span class="ni">▲</span><div>

        <p style="margin-top:14px">Puedes <b>desactivarla</b>: deja de aparecer para asignar
        personal nuevo, pero conserva su histórico de nómina.</p>`
      :`<p>No tiene empleados asignados, así que puede eliminarse.</p>`}

             onclick="confirmarBorrarTienda('${id}')">Eliminar</button>`}

async function confirmarBorrarTienda(id){

async function alternarTienda(id){

function abrirImportador(tipo='empleados'){
  IMPORT={tipo,filas:[],validas:[],errores:[],faltan:[]};

  const alcance = FILTRO.tienda || tiendaFija();
  const ejemplo = tipo==='empleados'
    ? "Cédula\tNombre\tCargo\tTienda\tFecha ingreso\tSalario\n18456789\tMaría Rodríguez\tVendedora\tT001\t01/03/2021\t200"
    : "Cédula\tFecha\tEntrada\tSalida almuerzo\tRegreso almuerzo\tSalida\n18456789\t27/08/2026\t08:54\t13:02\t14:00\t17:10";
  modal(`<div class="modal wide"><div class="modal-h">
      <h3>Cargar ${esq.et.toLowerCase()} desde Excel</h3><button class="x" onclick="cerrarModal()">×</button></div>
    <div class="modal-b">
      <div class="tipo-sw">
        <button class="${tipo==='empleados'?'on':''}" onclick="abrirImportador('empleados')">☷ Empleados</button>
        <button class="${tipo==='asistencia'?'on':''}" onclick="abrirImportador('asistencia')">◷ Marcajes de asistencia</button>
      </div>

        ? `<div class="note in" style="margin-bottom:14px"><span class="ni">◔</span><div>
            Las filas que no traigan columna de tienda se asignarán a
            <b>${esc(nomTienda(alcance))}</b>, la tienda que tienes seleccionada.</div></div>`
        : `<div class="note wa" style="margin-bottom:14px"><span class="ni">⚑</span><div>
            No tienes ninguna tienda seleccionada, así que el archivo <b>debe traer la columna Tienda</b>.
            Si prefieres, cierra esto, elige una tienda arriba y vuelve a entrar.</div></div>`)
      : (alcance
        ? `<div class="note in" style="margin-bottom:14px"><span class="ni">◔</span><div>
            Solo se aceptarán marcajes de empleados de <b>${esc(nomTienda(alcance))}</b>.
            Los de otras tiendas se rechazan con su motivo.</div></div>`
        : `<div class="note in" style="margin-bottom:14px"><span class="ni">◔</span><div>
            Se aceptarán marcajes de cualquier tienda. Las horas de almuerzo se descuentan
            del total, y se marca retardo pasados los 10 minutos de tolerancia.</div></div>`)}

      <div class="drop" id="dropzone"
        onclick="document.getElementById('filein').click()"
        ondragover="event.preventDefault();this.classList.add('over')"
        ondragleave="this.classList.remove('over')"
        ondrop="event.preventDefault();this.classList.remove('over');archivoImport(event.dataTransfer.files[0])">
        <div class="big">↥</div><b>Arrastra tu archivo aquí</b>
        <span>o haz clic para buscarlo · .xlsx, .csv o .txt</span>
      </div>
      <input type="file" id="filein" accept=".xlsx,.csv,.tsv,.txt" style="display:none"
        onchange="archivoImport(this.files[0])">

      <details style="margin-top:16px">
        <summary style="cursor:pointer;font-size:13.5px;color:var(--brand);font-weight:600">
          O pega las filas directamente desde Excel</summary>
        <p class="hintx" style="margin:8px 0">Selecciona en Excel el rango con encabezados,
          cópialo con Ctrl+C y pégalo aquí.</p>
        <textarea id="pegado" placeholder="${esc(ejemplo)}"></textarea>
        <button class="btn ghost sm" style="margin-top:8px"
          onclick="pegarImport(document.getElementById('pegado').value)">Analizar lo pegado</button>
      </details>

      <div style="margin-top:18px">
        <div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:8px">
          Columnas que reconoce</div>

          <thead><tr><th>Campo</th><th>Encabezados aceptados</th><th>Obligatorio</th></tr></thead>
          <tbody>${esq.campos.map(c=>`<tr><td><b>${c.et}</b></td>
            <td style="font-size:12.5px;color:var(--ink-3)">${c.claves.slice(0,5).join(' · ')}</td>
            <td>${c.oblig?'<span class="pill cr">Sí</span>':'<span class="pill nu">No</span>'}</td>
            </tr>`).join('')}</tbody></table></div>
        <p class="hintx">${tipo==='empleados'
          ? 'La columna Tienda acepta el código (T001) o el nombre completo. Las fechas se entienden en día/mes/año o año-mes-día.'
          : 'Las horas se aceptan como 08:54, 8:54 a. m., 0854 o el formato de hora de Excel. Si faltan las de almuerzo, no se descuenta nada.'}</p>

    </div>
    <div class="modal-f">
      <button class="btn ghost sm" onclick="cerrarModal()">Cancelar</button>
      <button class="btn sm" id="btnimport" style="width:auto;opacity:.45" disabled
        onclick="confirmarImport()">Nada que cargar</button>
    </div></div>`);
}

function previaInvitacion(){
  const g=k=>{const el=document.getElementById('i_'+k); return el?el.value.trim():''};
  const o={nombre:g('n')||'Nombre Apellido', rol:g('rol')};
  if(g('rol')!=='gerente_general' && g('t')) o.tienda=g('t');
  if(g('ci')) o.cedula=g('ci');
  const ta=document.getElementById('i_json'); if(ta) ta.value=JSON.stringify(o,null,2);
}
function copiarJSON(){
  const ta=document.getElementById('i_json'); ta.select();
  navigator.clipboard.writeText(ta.value).then(()=>aviso('Copiado'),()=>aviso('Selecciona y copia manualmente'));
}
function tiendaSegunRol(){
  const rol=document.getElementById('u_rol'), sel=document.getElementById('u_t'),
        h=document.getElementById('u_hint');
  if(!rol||!sel) return;
  const global = rol.value==='gerente_general';
  sel.disabled=global; sel.style.opacity=global?.5:1;
  if(global) sel.value='';
  if(h) h.textContent = global
    ? 'El gerente general ve todas las tiendas.'
    : 'Solo verá los datos de esta tienda.';
}

/* ---------- RECIBOS: selección e impresión ---------- */
let SEL_RECIBOS=new Set();
function alternarRecibo(ci){
  SEL_RECIBOS.has(ci) ? SEL_RECIBOS.delete(ci) : SEL_RECIBOS.add(ci);
  pintar();
}
function seleccionarTodos(cis){
  const todos = cis.every(c=>SEL_RECIBOS.has(c));
  todos ? cis.forEach(c=>SEL_RECIBOS.delete(c)) : cis.forEach(c=>SEL_RECIBOS.add(c));
  pintar();
}
function reciboDe(e){
  const asig=[['Salario base · 16 días', e.sal*TASA*0.5*0.8],
              ['Horas extra diurnas', e.sal*TASA*0.03],
              ['Cestaticket', 10000], ['Bono de guerra económica', 40000]];
  const tA=asig.reduce((a,x)=>a+x[1],0);
  const ded=[['IVSS · 4 %',18],['RPE Paro Forzoso · 0,5 %',2.25],['FAOV · 1 %',tA*0.0039]];
  const tD=ded.reduce((a,x)=>a+x[1],0);
  const salarial=asig.slice(0,2).reduce((a,x)=>a+x[1],0);
  return {e,asig,ded,tA,tD,neto:tA-tD,salarial,noSal:tA-salarial};
}

  const emps = ESTADO.empleados.filter(e=>cis.includes(e.ci));
  if(!emps.length) return aviso('Selecciona al menos un recibo');
  document.getElementById('printzone').innerHTML = emps.map((e,i)=>hojaRecibo(reciboDe(e),i)).join('');

  aviso(emps.length===1 ? 'Abriendo el recibo…' : `Abriendo ${emps.length} recibos…`);

function guardarIncidencia(){
  const g=k=>{const el=document.getElementById('i_'+k);return el?el.value.trim():''};
  const emp = ROL==='empleado' ? ESTADO.empleados.find(e=>e.n===R().n)
                               : ESTADO.empleados.find(e=>e.id===g('emp'));
  if(!emp) return aviso('Selecciona un empleado');
  if(!g('m')) return aviso('Falta el motivo');
  ESTADO.incidencias.unshift({id:uid(),eid:emp.id,n:emp.n,t:emp.t,tipo:g('tipo'),
    desde:g('d'),hasta:g('h'),mot:g('m'),est:'pendiente'});
  auditar('Registró incidencia',emp.n+' · '+g('tipo'));
  aviso('Incidencia registrada · queda pendiente de aprobación');
  cerrarModal(); pintar();
}
function marcar(tipo){
  const emp = ROL==='empleado' ? ESTADO.empleados.find(e=>e.n===R().n) : null;
  const hora = new Date().toTimeString().slice(0,5);
  if(emp){
    const a = ESTADO.asistencia[emp.id] || (ESTADO.asistencia[emp.id]={ent:'—',sal:'—',est:'presente',ret:0});
    if(tipo==='entrada'){ a.ent=hora; a.est='presente'; } else if(tipo==='salida') a.sal=hora;
    aviso(`Marcaje de ${tipo} registrado a las ${hora}`);
  } else aviso(`Marcaje de ${tipo} registrado a las ${hora}`);
  auditar('Registró marcaje',tipo+' '+hora);
  pintar();
}

function tipEl(){ let t=document.getElementById('tip');
  if(!t){t=document.createElement('div');t.id='tip';t.style.cssText=
   'position:fixed;z-index:500;pointer-events:none;opacity:0;transition:opacity .1s;'+
   'background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 11px;'+
   'font-size:12.5px;box-shadow:var(--shadow);max-width:240px;line-height:1.45;color:var(--ink)';
   document.body.appendChild(t);} return t; }
function showTip(e,html){const t=tipEl();t.innerHTML=html;t.style.opacity='1';
  let x=e.clientX+12, y=e.clientY+12;
  if(x+t.offsetWidth>innerWidth-8) x=e.clientX-t.offsetWidth-12;
  if(y+t.offsetHeight>innerHeight-8) y=e.clientY-t.offsetHeight-12;
  t.style.left=x+'px'; t.style.top=y+'px';}
function hideTip(){const t=document.getElementById('tip'); if(t)t.style.opacity='0';}

function barrasH(datos,{fmt=k,color='var(--c1)',alto=26,gap=11}={}){
  if(!datos.length) return '<p class="empty" style="padding:26px">Sin datos para mostrar</p>';
  const max=Math.max(...datos.map(d=>d.v),1)*1.02, W=640, LW=190, VW=80;
  const bw=W-LW-VW, H=datos.length*(alto+gap);
  const corta=t=>t.length>26?t.slice(0,25)+'…':t;
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">`;
  datos.forEach((d,i)=>{
    const y=i*(alto+gap), w=Math.max(bw*d.v/max,3);
    s+=`<text x="${LW-12}" y="${y+alto/2+5}" text-anchor="end">${esc(corta(d.l))}</text>`;
    s+=`<rect x="${LW}" y="${y}" width="${bw}" height="${alto}" rx="3" fill="var(--sunken)"/>`;
    s+=`<rect x="${LW}" y="${y}" width="${w}" height="${alto}" rx="4" fill="${d.c||color}"
         style="cursor:pointer" onmousemove="showTip(event,'<b>${esc(d.l)}</b><br>${d.tip||fmt(d.v)}')"
         onmouseleave="hideTip()"/>`;
    s+=`<text class="v" x="${LW+bw+9}" y="${y+alto/2+5}">${fmt(d.v)}</text>`;
  });
  return s+'</svg>';
}
function apiladas(labels,series,{fmt=v=>v.toFixed(1).replace('.',',')+' M'}={}){
  const W=680,H=210,PL=42,PB=26,PT=8;
  const tot=labels.map((_,i)=>series.reduce((a,s)=>a+s.d[i],0));
  const max=Math.max(Math.ceil(Math.max(...tot)/8)*8,8), gw=(W-PL)/labels.length, bw=Math.min(gw*.52,46);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img"><g class="grid">`;
  for(let i=0;i<=4;i++){const y=PT+(H-PT-PB)*i/4;
    s+=`<line x1="${PL}" y1="${y}" x2="${W}" y2="${y}"/>`;
    s+=`<text class="v" x="${PL-8}" y="${y+4}" text-anchor="end">${(max*(4-i)/4).toFixed(0)}</text>`;}
  s+='</g>';
  labels.forEach((lb,i)=>{
    const cx=PL+gw*i+gw/2, x=cx-bw/2; let acc=0;
    series.forEach((se,j)=>{
      const v=se.d[i], h=(H-PT-PB)*v/max, y=H-PB-h-acc;
      s+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h-2,1)}" rx="${j===series.length-1?4:2}"
           fill="${se.c}" style="cursor:pointer"
           onmousemove="showTip(event,'<b>${lb} 2026</b><br>${se.n}: ${fmt(v)}<br>Total ${fmt(tot[i])}')"
           onmouseleave="hideTip()"/>`;
      acc+=h;});
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${lb}</text>`;});
  return s+'</svg>';
}

  <div class="grid tiles" style="margin-bottom:16px">
    <div class="tile"><div class="lab">Personal activo</div><div class="val">${emps.length}</div>
      <div class="meta">${T.length} tienda${T.length===1?'':'s'} · ${emps.filter(e=>e.est!=='activo').length} en reposo o vacaciones</div></div>
    ${ver?`
    <div class="tile"><div class="lab">Costo laboral · agosto</div><div class="val">Bs. ${k(tot)}</div>
      <div class="meta">USD ${k(tot/TASA)} a la tasa del periodo</div></div>
    <div class="tile alert"><div class="lab">Pasivo por prestaciones</div><div class="val">Bs. ${k(tot*3.1)}</div>

  </div>
  ${ver?`
  <div class="grid" style="grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start;margin-bottom:16px">
    <div class="card"><div class="card-h"><div><h3>Qué parte del pago genera prestaciones</h3>
      <p class="sub">Millones de bolívares por mes</p></div></div>
      <div class="card-b">
        ${apiladas(MESES,[{n:'Salario (con incidencia)',c:'var(--c1)',
            d:MESES.map((_,i)=>tot*0.358/1e6*(0.88+i*0.025))},
          {n:'Bonos (sin incidencia)',c:'var(--c2)',
            d:MESES.map((_,i)=>tot*0.642/1e6*(0.72+i*0.06))}])}
        ${leyenda([{n:'Salario · genera prestaciones',c:'var(--c1)'},
                   {n:'Bonos · no generan nada',c:'var(--c2)'}])}
        <div class="note cr" style="margin-top:16px"><span class="ni">▲</span>
          <div>En agosto, <b>solo el 35,8 %</b> de lo pagado cuenta como salario.</div></div>
      </div></div>
    <div class="card"><div class="card-h"><div><h3>Costo laboral por tienda</h3>
      <p class="sub">Bolívares · agosto 2026</p></div></div>
      <div class="card-b">${barrasH(T.map(t=>({l:t.nombre,v:costoTienda(t.codigo),
        tip:t.ciudad+'<br>Bs. '+bs(costoTienda(t.codigo))+'<br>'+
            ESTADO.empleados.filter(e=>e.t===t.codigo).length+' empleados'})))}</div></div>
  </div>`:''}
  ${tablaAsistencia(emps)}`;

    `<button class="btn ghost sm" onclick="abrirImportador()">↥ Cargar desde Excel</button>
     <button class="btn sm" style="width:auto" onclick="formEmpleado()">+ Nuevo empleado</button>`:'')})}

      <div class="meta">de ${ESTADO.empleados.length} en total</div></div>
    <div class="tile"><div class="lab">Activos</div><div class="val">${cuenta('activo')}</div></div>
    <div class="tile"><div class="lab">De vacaciones</div><div class="val">${cuenta('vacaciones')}</div></div>

  <div class="card">
